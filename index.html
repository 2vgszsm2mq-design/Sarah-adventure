<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sarah's Adventure ❤️ – V3 Pro</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a0d2a;font-family:Arial,Helvetica,sans-serif}
body{position:fixed;inset:0}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:
linear-gradient(rgba(16,8,28,.22), rgba(16,8,28,.46)),
linear-gradient(#2d1748,#f2a3b4)}
.panel{width:min(88vw,820px);padding:28px 24px;border-radius:28px;text-align:center;color:#fff;background:rgba(27,13,44,.58);border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
h1{margin:0 0 12px;font-size:clamp(38px,6vw,74px)} .sub{margin:0 0 22px;font-size:clamp(18px,2vw,24px)}
button{border:none;border-radius:18px;min-width:240px;padding:18px 24px;font-size:clamp(22px,2.4vw,30px);font-weight:800;color:white;background:linear-gradient(180deg,#ff90ca,#ff4ca5);box-shadow:0 12px 28px rgba(0,0,0,.24),0 0 22px rgba(255,77,166,.3)}
.hidden{display:none!important}
#hud{position:fixed;left:16px;right:16px;top:10px;z-index:11;display:flex;justify-content:space-between;color:white;font-weight:800;font-size:clamp(18px,2vw,22px);text-shadow:0 3px 10px rgba(0,0,0,.52);pointer-events:none}
#bossHud{position:fixed;left:50%;top:16px;transform:translateX(-50%);width:min(74vw,680px);z-index:12;text-align:center;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.5);display:none}
#bossName{font-size:clamp(24px,3vw,36px);font-weight:900;letter-spacing:.5px;margin-bottom:8px}
#bossBar{height:22px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.28)}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff6178,#ff9d62,#ffc14f)}
#controls{position:fixed;left:0;right:0;bottom:max(10px, env(safe-area-inset-bottom));z-index:12;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none}
.group{display:flex;gap:12px}
.control{pointer-events:auto;min-width:92px;min-height:66px;padding:12px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.28);color:white;font-weight:800;font-size:20px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);box-shadow:0 12px 24px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div id="menu">
  <div class="panel">
    <div style="font-size:clamp(22px,2.8vw,34px);margin-bottom:10px">Til min prinsesse Sarah</div>
    <h1>Sarah's Adventure ❤️</h1>
    <div class="sub">V3 Pro · bedre Sarah, boss og strandverden</div>
    <button id="startBtn">NYT SPIL</button>
  </div>
</div>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div>❤️ <span id="lives">3</span> · 🪙 <span id="coins">0</span></div><div>Love Beach</div></div>
<div id="bossHud"><div id="bossName">KING CRAB 👑</div><div id="bossBar"><div id="bossFill"></div></div></div>
<div id="controls" class="hidden">
  <div class="group"><button class="control" data-act="left">◀</button><button class="control" data-act="right">▶</button></div>
  <div class="group"><button class="control" data-act="jump">⤒ Hop</button></div>
</div>

const keys = {left:false,right:false,jump:false};
const state = {running:false,cameraX:0,time:0,shake:0};
const world = {
  width: 4200,
  groundY: 0,
  platforms: [],
  coins: [],
  enemies: [],
  boss: {x: 3600, y: 0, w: 200, h: 150, hp: 12, maxHp: 12, alive: true}
};
const player = {x:160,y:0,w:150,h:210,vx:0,vy:0,speed:5.7,jump:-15.5,onGround:false,lives:3,coins:0,facing:1,invuln:0};

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  world.groundY = canvas.height - 120;
  if(!state.running) player.y = world.groundY - player.h;
  world.boss.y = world.groundY - world.boss.h + 8;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 60));
resizeCanvas();

function buildWorld(){
  world.groundY = canvas.height - 120;
  world.platforms = [
    {x:0,y:world.groundY,w:900,h:140},
    {x:980,y:world.groundY,w:900,h:140},
    {x:1960,y:world.groundY,w:980,h:140},
    {x:3040,y:world.groundY,w:1160,h:140},
    {x:420,y:world.groundY-120,w:220,h:18},
    {x:860,y:world.groundY-220,w:220,h:18},
    {x:1500,y:world.groundY-120,w:220,h:18},
    {x:2300,y:world.groundY-120,w:220,h:18},
    {x:2850,y:world.groundY-220,w:220,h:18},
  ];
  world.coins = [];
  [220,320,420,520,620,780,920,1060,1160,1260,1400,1520,1660,1880,2020,2160,2300,2440,2620,2820,3020,3220,3420].forEach((x,i)=> {
    world.coins.push({x:x, y:i%3===0?world.groundY-250:(i%2===0?world.groundY-80:world.groundY-155), r:12, collected:false});
  });
  world.enemies = [
    {x:1420,y:world.groundY-46,w:56,h:46,min:1300,max:1780,dir:1,alive:true},
    {x:2360,y:world.groundY-46,w:56,h:46,min:2200,max:2600,dir:1,alive:true},
    {x:3150,y:world.groundY-46,w:56,h:46,min:3000,max:3480,dir:1,alive:true},
  ];
  world.boss = {x: 3600, y: world.groundY - 142, w: 210, h: 150, hp: 12, maxHp: 12, alive: true, flash: 0};
  player.x = 160; player.y = world.groundY - player.h; player.vx = 0; player.vy = 0; player.coins = 0; player.lives = 3; player.onGround = false; player.facing = 1; player.invuln = 0;
  state.cameraX = 0; state.time = 0;
}

function startGame(){ buildWorld(); state.running = true; menu.classList.add('hidden'); hud.classList.remove('hidden'); controls.classList.remove('hidden'); }
document.getElementById('startBtn').addEventListener('click', startGame);

function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

document.querySelectorAll('.control').forEach(btn => {
  const act = btn.dataset.act;
  const on = e => { e.preventDefault(); keys[act] = true; };
  const off = e => { e.preventDefault(); keys[act] = false; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});
window.addEventListener('keydown', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.jump = true;
});
window.addEventListener('keyup', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.jump = false;
});

function hurt() {
  if(player.invuln > 0) return;
  player.lives = Math.max(1, player.lives - 1);
  player.invuln = 50;
  state.shake = 8;
}

function update(){
  if(!state.running) return;
  state.time++;

  if(keys.left) { player.vx = -5.7; player.facing = -1; }
  else if(keys.right) { player.vx = 5.7; player.facing = 1; }
  else player.vx *= 0.75;

  if(keys.jump && player.onGround) {
    player.vy = player.jump; player.onGround = false; keys.jump = false;
  }

  player.vy += 0.85;
  if(player.vy > 18) player.vy = 18;
  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  for(const p of world.platforms){
    if(overlap(player,p)) {
      const prevBottom = player.y + player.h - player.vy;
      if(prevBottom <= p.y + 18 && player.vy >= 0) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
      }
    }
  }

  for(const e of world.enemies){
    if(!e.alive) continue;
    e.x += e.dir * 1.6;
    if(e.x < e.min || e.x > e.max) e.dir *= -1;
    if(overlap(player,e)){
      const stomp = player.vy > 2 && player.y + player.h - e.y < 30;
      if(stomp) {
        e.alive = false;
        player.vy = -10;
      } else {
        hurt();
      }
    }
  }

  const b = world.boss;
  if(b.alive) {
    if(Math.abs(player.x - b.x) < 650) {
      bossHud.style.display = 'block';
      bossFill.style.width = (b.hp / b.maxHp * 100) + '%';
    } else {
      bossHud.style.display = 'none';
    }
    if(overlap(player,b)) hurt();
    if(Math.abs(player.x - b.x) < 180 && player.vy === 0 && player.onGround) {
      b.hp = Math.max(0, b.hp - 0.02);
      state.shake = 2;
      if(b.hp <= 0) b.alive = false;
    }
  } else {
    bossHud.style.display = 'none';
  }

  if(player.x < 0) player.x = 0;
  if(player.x > world.width - player.w) player.x = world.width - player.w;
  if(player.y > canvas.height + 200) {
    player.x = 160; player.y = world.groundY - player.h; player.vx = 0; player.vy = 0;
  }

  for(const c of world.coins){
    if(!c.collected && Math.hypot(player.x + player.w/2 - c.x, player.y + player.h/2 - c.y) < 52){
      c.collected = true; player.coins += 1;
    }
  }

  if(player.invuln > 0) player.invuln--;

  let target = player.x - canvas.width * 0.40;
  target = Math.max(0, Math.min(target, world.width - canvas.width));
  state.cameraX += (target - state.cameraX) * 0.13;

  livesEl.textContent = player.lives;
  coinsEl.textContent = player.coins;
}

function drawPalm(x,baseY,h){
  ctx.fillStyle = 'rgba(24,10,32,.92)';
  ctx.fillRect(x-5, baseY-h, 10, h);
  for(let i=0;i<6;i++){
    ctx.save();
    ctx.translate(x, baseY-h);
    ctx.rotate(-1.05 + i*0.4);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(74,-16,136,22);
    ctx.quadraticCurveTo(74,18,0,8);
    ctx.fill();
    ctx.restore();
  }
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,'#2d1748'); sky.addColorStop(0.52,'#6c39a5'); sky.addColorStop(1,'#f2a3b4');
  ctx.fillStyle = sky; ctx.fillRect(0,0,canvas.width,canvas.height);

  const sunX = canvas.width * 0.78, sunY = 150;
  const sun = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,110);
  sun.addColorStop(0,'rgba(255,244,184,.95)'); sun.addColorStop(.35,'rgba(255,219,140,.46)'); sun.addColorStop(1,'rgba(255,219,140,0)');
  ctx.fillStyle = sun; ctx.fillRect(sunX-120, sunY-120, 240, 240);

  for(let i=0;i<9;i++){
    const x = ((i*320 - state.cameraX*0.12) % (canvas.width+260)) - 120;
    const y = 120 + (i%3)*28;
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath();
    ctx.arc(x,y,32,0,Math.PI*2); ctx.arc(x+38,y+8,24,0,Math.PI*2); ctx.arc(x-30,y+10,22,0,Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(-(state.cameraX*0.10),0);
  for(let i=0;i<8;i++){
    const bx = i*520 - 40;
    ctx.fillStyle = i%2 ? 'rgba(80,34,112,.32)' : 'rgba(60,24,92,.40)';
    ctx.beginPath();
    ctx.moveTo(bx,canvas.height-160);
    ctx.quadraticCurveTo(bx+130,canvas.height-360,bx+280,canvas.height-160);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = 'rgba(255,209,224,.40)';
  ctx.fillRect(0, canvas.height - 190, canvas.width, 200);

  // water strip
  ctx.fillStyle = 'rgba(208,180,240,.44)';
  ctx.fillRect(0, canvas.height - 190, canvas.width, 72);

  const sand = ctx.createLinearGradient(0, canvas.height - 160, 0, canvas.height);
  sand.addColorStop(0, '#e8c89d'); sand.addColorStop(1, '#c79a63');
  ctx.fillStyle = sand; ctx.fillRect(0, canvas.height - 160, canvas.width, 200);

  ctx.save();
  ctx.translate(-(state.cameraX*0.16),0);
  [120,1180,2260,3340].forEach((x,i)=>drawPalm(x, canvas.height-160, i%2?170:190));
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.shadowColor = 'rgba(255,80,80,.35)';
  ctx.shadowBlur = 18;
  ctx.fillStyle='rgba(255,100,100,.18)';
  ctx.beginPath(); ctx.arc(e.x+24,e.y+24,30,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d33b3b';
  ctx.beginPath(); ctx.arc(e.x+24,e.y+24,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(e.x+10,e.y+10,8,8); ctx.fillRect(e.x+28,e.y+10,8,8);
  ctx.restore();
}

function drawWorld(){
  ctx.save();
  if(state.shake > 0) {
    const sx = (Math.random()-0.5)*state.shake, sy=(Math.random()-0.5)*state.shake*0.6;
    ctx.translate(sx, sy);
    state.shake *= 0.86;
    if(state.shake < 0.2) state.shake = 0;
  }
  ctx.translate(-state.cameraX, 0);

  for(const p of world.platforms){
    ctx.fillStyle = p.y >= world.groundY ? '#d7af79' : '#efce98';
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle = p.y >= world.groundY ? '#75d767' : '#ffe0af';
    ctx.fillRect(p.x,p.y,p.w,18);
  }

  for(const c of world.coins){
    if(c.collected) continue;
    ctx.fillStyle = 'rgba(255,231,150,.22)';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r+9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill();
  }

  for(const e of world.enemies) if(e.alive) drawEnemy(e);

  if(world.boss.alive) {
    const b = world.boss;
    ctx.save();
    ctx.shadowColor = 'rgba(255,65,65,.42)';
    ctx.shadowBlur = 28;
    ctx.drawImage(bossSprite, b.x, b.y, b.w, b.h);
    ctx.restore();
  }

  drawSarah();
  ctx.restore();
}

function drawSarah(){
  const frameW = 80, frameH = 112;
  let frame = 0;
  if(!player.onGround) frame = 3;
  else if(Math.abs(player.vx) > 0.8) frame = (Math.floor(state.time / 8) % 2) + 1;
  else frame = 0;

  ctx.save();
  if(player.facing === -1) {
    ctx.translate(player.x + player.w, 0);
    ctx.scale(-1, 1);
    ctx.translate(-player.x, 0);
  }
  ctx.shadowColor = 'rgba(255,120,180,.24)';
  ctx.shadowBlur = 18;
  if(!(player.invuln > 0 && Math.floor(player.invuln/4)%2===0)){
    ctx.drawImage(sprite, frame*frameW, 0, frameW, frameH, player.x, player.y, player.w, player.h);
  }
  ctx.restore();
}

function loop(){ update(); drawBackground(); if(state.running) drawWorld(); requestAnimationFrame(loop); }
loop();
</script>
