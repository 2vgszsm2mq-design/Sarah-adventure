<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sarah's Adventure ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu">
  <div class="menu-bg"></div>
  <div class="panel">
    <div class="eyebrow">Til min prinsesse Sarah</div>
    <h1>Sarah's Adventure ❤️</h1>
    <button id="startBtn">NYT SPIL</button>
  </div>
</div>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div>❤️ <span id="lives">3</span> · 🪙 <span id="coins">0</span></div>
  <div>Love Beach</div>
</div>

<div id="controls" class="hidden">
  <div class="left">
    <button class="control" data-act="left">◀</button>
    <button class="control" data-act="right">▶</button>
  </div>
  <div class="right">
    <button class="control" data-act="jump">⤒ Hop</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
