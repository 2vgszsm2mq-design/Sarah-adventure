<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip-scanner Mobile</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e2f1;
      --green: #198754;
      --yellow: #b7791f;
      --red: #c53030;
      --blue: #1f5eff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }
    .sub {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(16,24,40,0.04);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 760px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
      .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #344054;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 16px;
      background: white;
      color: var(--text);
    }
    textarea { min-height: 96px; resize: vertical; }
    .btnrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: var(--blue);
      color: white;
      flex: 1;
    }
    .secondary {
      background: #eef4ff;
      color: var(--blue);
    }
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (min-width: 760px) {
      .results { grid-template-columns: repeat(5, 1fr); }
    }
    .metric {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fbfcfe;
    }
    .metric .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .metric .v {
      font-size: 20px;
      font-weight: 800;
    }
    .status-green { color: var(--green); }
    .status-yellow { color: var(--yellow); }
    .status-red { color: var(--red); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
    }
    .green { background: #e8fff3; color: var(--green); }
    .yellow { background: #fff7e6; color: var(--yellow); }
    .red { background: #ffeaea; color: var(--red); }
    .footer {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Flip-scanner Mobile</h1>
      <div class="sub">iPhone-venlig flip-beregner til villa, sommerhus og lejlighed. Udfyld felterne og tryk <strong>Beregn</strong>.</div>
    </div>

    <div class="card">
      <div class="grid two">
        <div>
          <label>Adresse</label>
          <input id="address" value="Eksempelvej 12" />
        </div>
        <div>
          <label>Boligtype</label>
          <select id="propertyType">
            <option value="villa">Villa</option>
            <option value="sommerhus">Sommerhus</option>
            <option value="lejlighed">Lejlighed</option>
          </select>
        </div>
      </div>

      <div class="grid three" style="margin-top:12px">
        <div>
          <label>Udbudspris (kr)</label>
          <input id="listingPrice" type="number" value="2995000" />
        </div>
        <div>
          <label>Boligareal m²</label>
          <input id="sqm" type="number" value="112" />
        </div>
        <div>
          <label>Renoveret m²-pris i området (kr)</label>
          <input id="benchmarkPsqm" type="number" value="34500" />
        </div>
      </div>

      <div class="grid three" style="margin-top:12px">
        <div>
          <label>Liggetid (dage)</label>
          <input id="daysOnMarket" type="number" value="148" />
        </div>
        <div>
          <label>Forventet liggetid i området</label>
          <input id="expectedDays" type="number" value="85" />
        </div>
        <div>
          <label>Prisfald (kr)</label>
          <input id="priceReduction" type="number" value="200000" />
        </div>
      </div>

      <div class="grid three" style="margin-top:12px">
        <div>
          <label>Byggeår</label>
          <input id="yearBuilt" type="number" value="1972" />
        </div>
        <div>
          <label>Grundareal m²</label>
          <input id="lotSize" type="number" value="924" />
        </div>
        <div>
          <label>Ejerudgift/md. (lejlighed)</label>
          <input id="ownerFee" type="number" value="0" />
        </div>
      </div>

      <div class="grid two" style="margin-top:12px">
        <div>
          <label>Eget renoveringsbudget (kr)</label>
          <input id="customReno" type="number" value="450000" />
        </div>
        <div>
          <label>Egen arbejdsindsats / rabat %</label>
          <input id="ownDiscount" type="number" value="20" />
        </div>
      </div>

      <div class="grid two" style="margin-top:12px">
        <div>
          <label>Egen målsalgpris (kr)</label>
          <input id="targetSale" type="number" value="3950000" />
        </div>
        <div>
          <label>Ekstra buffer / uforudsete (kr)</label>
          <input id="extraBuffer" type="number" value="50000" />
        </div>
      </div>

      <div style="margin-top:12px">
        <label>Noter / nøgleord</label>
        <textarea id="notes">håndværkertilbud, slidt køkken, dårlig planløsning, stort grundareal, kosmetisk</textarea>
      </div>

      <div class="btnrow" style="margin-top:14px">
        <button class="primary" onclick="calculate()">Beregn</button>
        <button class="secondary" onclick="loadExample()">Eksempel</button>
        <button class="secondary" onclick="resetForm()">Nulstil</button>
      </div>
    </div>

    <div class="card">
      <div class="results">
        <div class="metric"><div class="k">Status</div><div class="v" id="mStatus">–</div></div>
        <div class="metric"><div class="k">Anbefaling</div><div class="v" id="mRecommendation">–</div></div>
        <div class="metric"><div class="k">Est. profit</div><div class="v" id="mProfit">–</div></div>
        <div class="metric"><div class="k">ROI</div><div class="v" id="mRoi">–</div></div>
        <div class="metric"><div class="k">Margin</div><div class="v" id="mMargin">–</div></div>
      </div>
    </div>

    <div class="card">
      <table>
        <tbody id="details"></tbody>
      </table>
      <div class="small" id="reasons" style="margin-top:12px"></div>
    </div>

    <div class="footer">Denne version kører lokalt i browseren og kan bruges direkte på iPhone via en almindelig webside.</div>
  </div>

  <script>
    const BASE_POSITIVE = {
      "håndværkertilbud": 10, "modernisering": 7, "prisfald": 6, "liggetid": 4,
      "dårlig planløsning": 8, "kan åbnes op": 8, "køkken/alrum": 6, "dødsbo": 8,
      "slidt køkken": 5, "slidt bad": 5, "kosmetisk": 4
    };
    const VILLA = {
      "stort grundareal": 8, "byggeret": 10, "tilbygning mulig": 10,
      "uudnyttet tagetage": 8, "garage kan ombygges": 7
    };
    const SUMMER = {
      "tæt på vand": 10, "havudsigt": 12, "udsigt": 6, "udlejning potentiale": 10,
      "anneks": 8, "ekstra sovepladser": 7, "stor terrasse": 6,
      "sommerhusområde": 4, "helårsanvendelse mulig": 8
    };
    const APARTMENT = {
      "altanmulighed": 8, "elevator": 4, "høj etage": 5, "lav ejerudgift": 6,
      "delevenlig": 7, "god planløsning efter ombygning": 8, "byfornyet ejendom": 5
    };
    const NEGATIVE = {
      "fugt": -15, "fugt i kælder": -18, "sætningsskade": -25, "fundament": -20,
      "radon": -10, "asbest": -12, "nyt tag nødvendigt": -14, "tag udskiftes": -14,
      "skimmel": -22, "kloak": -12, "forurening": -30, "høj ejerudgift": -10,
      "ingen udlejning": -12, "fredning": -10
    };

    function val(id) {
      return document.getElementById(id).value;
    }
    function num(id) {
      const n = parseFloat(val(id));
      return isNaN(n) ? 0 : n;
    }
    function textNorm(s) {
      return (s || "").toLowerCase().trim();
    }
    function dk(n) {
      return new Intl.NumberFormat('da-DK').format(Math.round(n || 0));
    }
    function pct(n) {
      return `${(Math.round((n || 0) * 10) / 10).toLocaleString('da-DK')}%`;
    }
    function scoreKeywords(notes, propertyType) {
      const t = textNorm(notes);
      let score = 0;
      const hits = [];
      const sets = [BASE_POSITIVE];
      if (propertyType === 'villa') sets.push(VILLA);
      if (propertyType === 'sommerhus') sets.push(SUMMER);
      if (propertyType === 'lejlighed') sets.push(APARTMENT);
      for (const set of sets) {
        for (const [k,v] of Object.entries(set)) {
          if (t.includes(k)) { score += v; hits.push(k); }
        }
      }
      for (const [k,v] of Object.entries(NEGATIVE)) {
        if (t.includes(k)) { score += v; hits.push(k); }
      }
      return {score, hits};
    }
    function determineStatus(score, profit) {
      if (score >= 55 && profit >= 350000) return ["GRØN", "KØB", "status-green", "green"];
      if (score >= 35 && profit >= 100000) return ["GUL", "KØB KUN BILLIGT", "status-yellow", "yellow"];
      return ["RØD", "SPRING OVER", "status-red", "red"];
    }
    function heuristicReno(propertyType, notes) {
      const t = textNorm(notes);
      let reno = 5500;
      if (propertyType === 'lejlighed') reno = 7000;
      if (propertyType === 'sommerhus') reno = 5000;
      if (t.includes('kosmetisk')) reno = Math.max(3500, reno - 1500);
      if (['fundament','fugt','sætningsskade','nyt tag nødvendigt','skimmel'].some(x => t.includes(x))) {
        reno = Math.max(reno, 8000);
      }
      return reno;
    }
    function calculate() {
      const propertyType = val('propertyType');
      const price = num('listingPrice');
      const sqm = num('sqm');
      const benchmarkPsqm = num('benchmarkPsqm');
      const days = num('daysOnMarket');
      const expectedDays = num('expectedDays');
      const reduction = num('priceReduction');
      const yearBuilt = num('yearBuilt');
      const lot = num('lotSize');
      const ownerFee = num('ownerFee');
      const customReno = num('customReno');
      const ownDiscount = Math.max(0, Math.min(100, num('ownDiscount')));
      const targetSale = num('targetSale');
      const extraBuffer = num('extraBuffer');
      const notes = val('notes');

      let score = 0;
      const reasons = [];

      const askingPsqm = sqm ? price / sqm : 0;
      const benchmarkExit = benchmarkPsqm && sqm ? benchmarkPsqm * sqm : 0;
      const exitValue = targetSale > 0 ? targetSale : benchmarkExit;

      let discountPct = 0;
      if (benchmarkPsqm && askingPsqm) {
        discountPct = Math.max(0, (benchmarkPsqm - askingPsqm) / benchmarkPsqm);
        score += Math.min(35, discountPct * 100 * 1.4);
        reasons.push(`rabat mod område: ${(discountPct*100).toFixed(1).replace('.', ',')}%`);
      }

      if (days) {
        const extraDays = Math.max(0, days - expectedDays);
        score += Math.min(12, extraDays / 15);
        reasons.push(`liggetid: ${days} dage`);
      }

      let reductionPct = 0;
      if (price > 0 && reduction > 0) {
        reductionPct = reduction / (price + reduction);
        score += Math.min(12, reductionPct * 100 * 1.5);
        reasons.push(`prisfald: ${dk(reduction)} kr`);
      }

      if (propertyType === 'villa') {
        if (yearBuilt >= 1960 && yearBuilt <= 1989) { score += 6; reasons.push('god flip-årgang'); }
        if (lot >= 800) { score += 6; reasons.push('stort grundareal'); }
        if (lot >= 1200) { score += 2; reasons.push('meget stort grundareal'); }
      }
      if (propertyType === 'sommerhus') {
        if (yearBuilt && yearBuilt <= 1995) { score += 4; reasons.push('ældre sommerhus med moderniseringspotentiale'); }
        if (lot >= 1000) { score += 5; reasons.push('stor naturgrund'); }
        if (textNorm(notes).includes('udlejning potentiale')) { score += 5; reasons.push('god til udlejning'); }
      }
      if (propertyType === 'lejlighed') {
        if (ownerFee && ownerFee <= 3500) { score += 5; reasons.push('lav ejerudgift'); }
        else if (ownerFee >= 6000) { score -= 6; reasons.push('høj ejerudgift'); }
        if (yearBuilt >= 1880 && yearBuilt <= 1935) { score += 3; reasons.push('klassisk lejlighedstype'); }
      }

      const keyword = scoreKeywords(notes, propertyType);
      score += keyword.score;
      if (keyword.hits.length) reasons.push('nøgleord: ' + keyword.hits.join(', '));

      const baseReno = customReno > 0 ? customReno : sqm * heuristicReno(propertyType, notes);
      const discountedReno = baseReno * (1 - ownDiscount / 100);
      const purchaseCosts = price * 0.04 + 75000;
      const salesCosts = Math.max(95000, exitValue * 0.025);
      const annualOwnerFee = propertyType === 'lejlighed' ? ownerFee * 12 : 0;
      const holdAllowance = annualOwnerFee * 0.5;
      const totalCost = price + discountedReno + purchaseCosts + salesCosts + holdAllowance + extraBuffer;
      const profit = exitValue - totalCost;
      const roi = totalCost > 0 ? (profit / totalCost) * 100 : 0;
      const margin = exitValue > 0 ? (profit / exitValue) * 100 : 0;

      reasons.push(targetSale > 0 ? 'egen målsalgpris brugt' : 'benchmark-salgsværdi brugt');
      reasons.push(customReno > 0 ? 'eget renoveringsbudget brugt' : 'standard renoveringsbudget brugt');
      if (ownDiscount > 0) reasons.push(`egen arbejdsindsats: -${ownDiscount}% på reno`);
      if (extraBuffer > 0) reasons.push('ekstra buffer indregnet');

      if (profit > 750000) { score += 10; reasons.push('højt profit-estimat'); }
      else if (profit > 400000) { score += 6; reasons.push('fornuftigt profit-estimat'); }
      else if (profit < 150000) { score -= 10; reasons.push('svagt profit-estimat'); }

      if (roi >= 18) { score += 5; reasons.push('stærk ROI'); }
      else if (roi < 8) { score -= 5; reasons.push('svag ROI'); }

      const [status, recommendation, statusClass, pillClass] = determineStatus(score, profit);

      document.getElementById('mStatus').textContent = status;
      document.getElementById('mStatus').className = `v ${statusClass}`;
      document.getElementById('mRecommendation').textContent = recommendation;
      document.getElementById('mRecommendation').className = `v ${statusClass}`;
      document.getElementById('mProfit').textContent = `${dk(profit)} kr`;
      document.getElementById('mRoi').textContent = pct(roi);
      document.getElementById('mMargin').textContent = pct(margin);

      const details = [
        ['Adresse', val('address')],
        ['Flip-score', score.toFixed(1).replace('.', ',')],
        ['M²-pris nu', `${dk(askingPsqm)} kr`],
        ['Benchmark m²-pris', `${dk(benchmarkPsqm)} kr`],
        ['Est. salgsværdi', `${dk(exitValue)} kr`],
        ['Renovering før rabat', `${dk(baseReno)} kr`],
        ['Renovering efter egen indsats', `${dk(discountedReno)} kr`],
        ['Købsomkostninger', `${dk(purchaseCosts)} kr`],
        ['Salgsomkostninger', `${dk(salesCosts)} kr`],
        ['Hold/ejertids-tillæg', `${dk(holdAllowance)} kr`],
        ['Ekstra buffer', `${dk(extraBuffer)} kr`],
        ['Samlet projektomkostning', `${dk(totalCost)} kr`],
        ['Status', `<span class="pill ${pillClass}">${status}</span>`],
        ['Anbefaling', recommendation]
      ];

      document.getElementById('details').innerHTML = details.map(([k,v]) =>
        `<tr><th>${k}</th><td>${v}</td></tr>`
      ).join('');

      document.getElementById('reasons').innerHTML = `<strong>Hvorfor den scorer sådan:</strong><br>${reasons.join(' | ')}`;
    }
    function loadExample() {
      document.getElementById('propertyType').value = 'villa';
      document.getElementById('address').value = 'Eksempelvej 12';
      document.getElementById('listingPrice').value = '2995000';
      document.getElementById('sqm').value = '112';
      document.getElementById('benchmarkPsqm').value = '34500';
      document.getElementById('daysOnMarket').value = '148';
      document.getElementById('expectedDays').value = '85';
      document.getElementById('priceReduction').value = '200000';
      document.getElementById('yearBuilt').value = '1972';
      document.getElementById('lotSize').value = '924';
      document.getElementById('ownerFee').value = '0';
      document.getElementById('customReno').value = '450000';
      document.getElementById('ownDiscount').value = '20';
      document.getElementById('targetSale').value = '3950000';
      document.getElementById('extraBuffer').value = '50000';
      document.getElementById('notes').value = 'håndværkertilbud, slidt køkken, dårlig planløsning, stort grundareal, kosmetisk';
      calculate();
    }
    function resetForm() {
      document.querySelectorAll('input, textarea').forEach(el => {
        if (el.type === 'number') el.value = 0;
        else el.value = '';
      });
      document.getElementById('propertyType').value = 'villa';
      document.getElementById('mStatus').textContent = '–';
      document.getElementById('mRecommendation').textContent = '–';
      document.getElementById('mProfit').textContent = '–';
      document.getElementById('mRoi').textContent = '–';
      document.getElementById('mMargin').textContent = '–';
      document.getElementById('details').innerHTML = '';
      document.getElementById('reasons').innerHTML = '';
    }
    loadExample();
  </script>
</body>
</html>
