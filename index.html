<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sarah's Adventure – V6.3 Mario Feel</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f1033;font-family:Arial,Helvetica,sans-serif}
body{position:fixed;inset:0;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:linear-gradient(#2d1748,#aa7da1)}
.panel{width:min(88vw,780px);padding:28px 24px;border-radius:28px;text-align:center;color:#fff;background:rgba(27,13,44,.60);border:2px solid rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{margin:0 0 10px;font-size:clamp(38px,6vw,72px)}
.sub{margin:0 0 22px;font-size:clamp(18px,2vw,24px)}
#startBtn{border:none;border-radius:18px;min-width:240px;padding:18px 24px;font-size:clamp(22px,2.4vw,30px);font-weight:800;color:white;background:linear-gradient(180deg,#ff9fd0,#ff4ca5)}
.hidden{display:none!important}
#hud{position:fixed;left:16px;right:16px;top:10px;z-index:11;display:flex;justify-content:space-between;color:white;font-weight:800;font-size:clamp(18px,2vw,22px);text-shadow:0 3px 10px rgba(0,0,0,.52);pointer-events:none}
#message{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:13;color:#fff;font-weight:800;font-size:20px;text-shadow:0 3px 10px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .25s}
#controls{position:fixed;left:0;right:0;bottom:max(10px, env(safe-area-inset-bottom));z-index:12;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none}
.group{display:flex;gap:12px}
.control{pointer-events:auto;min-width:92px;min-height:66px;padding:12px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.28);color:white;font-weight:800;font-size:20px;background:rgba(255,255,255,.18);backdrop-filter: blur(4px)}
</style>
</head>
<body>
<div id="menu">
  <div class="panel">
    <div style="font-size:clamp(22px,2.8vw,34px);margin-bottom:10px">Til min prinsesse Sarah</div>
    <h1>Sarah's Adventure ❤️</h1>
    <div class="sub">V6.3 Mario feel</div>
    <button id="startBtn">NYT SPIL</button>
  </div>
</div>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div>❤️ <span id="lives">3</span> · 🪙 <span id="coins">0</span></div>
  <div>Love Beach</div>
</div>
<div id="message"></div>
<div id="controls" class="hidden">
  <div class="group">
    <button class="control" data-act="left">◀</button>
    <button class="control" data-act="right">▶</button>
  </div>
  <div class="group">
    <button class="control" data-act="jump">⤒ Hop</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const controls = document.getElementById("controls");
const message = document.getElementById("message");
const livesEl = document.getElementById("lives");
const coinsEl = document.getElementById("coins");
const startBtn = document.getElementById("startBtn");

let groundY = 0;
let running = false;
const keys = {left:false,right:false,jump:false};

const state = {
  cameraX:0,time:0,shake:0,win:false,
  particles:[], texts:[],
  combo:0, comboTimer:0
};

const player = {
  x:120, y:0, w:48, h:82,
  vx:0, vy:0,
  maxSpeed:7.2, accel:0.82, friction:0.78, jump:-16.7,
  onGround:false, lives:3, coins:0, facing:1,
  squashX:1, squashY:1,
  landedAt:-999, wasOnGround:false, coyote:0, jumpBuffer:0,
  blink:100, idleSeed:0
};

const world = {
  width:4600, platforms:[], coins:[], enemies:[], goalX:4180
};

function resizeCanvas(){
  canvas.width = Math.max(1, window.innerWidth);
  canvas.height = Math.max(1, window.innerHeight);
  groundY = canvas.height - 120;
  if(!running) player.y = groundY - player.h;
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", ()=>setTimeout(resizeCanvas,60));
resizeCanvas();

function showMessage(text, ms=1600){
  message.textContent = text;
  message.style.opacity = "1";
  clearTimeout(showMessage.t);
  showMessage.t = setTimeout(()=>message.style.opacity="0", ms);
}

function buildWorld(){
  world.platforms = [
    {x:0,y:groundY,w:900,h:150,ground:true},
    {x:1060,y:groundY,w:720,h:150,ground:true},
    {x:1920,y:groundY,w:760,h:150,ground:true},
    {x:2820,y:groundY,w:760,h:150,ground:true},
    {x:3720,y:groundY,w:980,h:150,ground:true},

    {x:320,y:groundY-110,w:170,h:18,ground:false},
    {x:650,y:groundY-200,w:190,h:18,ground:false},
    {x:1220,y:groundY-120,w:170,h:18,ground:false},
    {x:1560,y:groundY-210,w:220,h:18,ground:false},
    {x:2120,y:groundY-110,w:180,h:18,ground:false},
    {x:2470,y:groundY-210,w:220,h:18,ground:false},
    {x:3040,y:groundY-120,w:180,h:18,ground:false},
    {x:3380,y:groundY-210,w:220,h:18,ground:false},
    {x:3960,y:groundY-140,w:220,h:18,ground:false}
  ];

  world.coins = [];
  const arcs = [
    [220, groundY-76],[300,groundY-110],[380,groundY-146],[460,groundY-110],[540,groundY-76],
    [700,groundY-232],[800,groundY-270],[900,groundY-232],
    [1140,groundY-82],[1220,groundY-116],[1300,groundY-152],[1380,groundY-116],
    [1580,groundY-240],[1690,groundY-280],[1800,groundY-240],
    [2080,groundY-84],[2160,groundY-118],[2240,groundY-154],[2320,groundY-118],
    [2500,groundY-244],[2610,groundY-284],[2720,groundY-244],
    [3000,groundY-86],[3080,groundY-120],[3160,groundY-156],[3240,groundY-120],
    [3400,groundY-242],[3510,groundY-282],[3620,groundY-242],
    [3920,groundY-172],[4050,groundY-212],[4180,groundY-172]
  ];
  arcs.forEach(([x,y], i)=> world.coins.push({x,y,r:12,collected:false,pulse:i*0.35,magnet:false,spin:i*0.2}));

  world.enemies = [
    {x:1180,y:groundY-36,w:46,h:32,min:1120,max:1380,dir:1,alive:true,bob:0},
    {x:2250,y:groundY-36,w:46,h:32,min:2140,max:2380,dir:1,alive:true,bob:0},
    {x:3210,y:groundY-36,w:46,h:32,min:3060,max:3340,dir:1,alive:true,bob:0},
    {x:4050,y:groundY-36,w:46,h:32,min:3940,max:4200,dir:1,alive:true,bob:0}
  ];

  world.goalX = 4180;

  Object.assign(player, {
    x:120,y:groundY-player.h,vx:0,vy:0,lives:3,coins:0,onGround:false,facing:1,
    squashX:1,squashY:1,landedAt:-999,wasOnGround:false,coyote:0,jumpBuffer:0,
    blink:100,idleSeed:Math.random()*999
  });
  Object.assign(state, {cameraX:0,time:0,shake:0,win:false,particles:[],texts:[],combo:0,comboTimer:0});
}

function startGame(){
  buildWorld();
  running = true;
  menu.classList.add("hidden");
  hud.classList.remove("hidden");
  controls.classList.remove("hidden");
  showMessage("Mario feel + Sarah vibe ❤️");
}

startBtn.addEventListener("click", startGame);
startBtn.addEventListener("touchstart",(e)=>{e.preventDefault(); startGame();},{passive:false});

function pressJump(e){ e.preventDefault(); keys.jump=true; player.jumpBuffer=8; }
function releaseJump(e){ e.preventDefault(); keys.jump=false; if(player.vy < -6) player.vy = -6; }

document.querySelectorAll(".control").forEach(btn=>{
  const act = btn.dataset.act;
  const on = e => { if(act==="jump") return pressJump(e); e.preventDefault(); keys[act]=true; };
  const off = e => { if(act==="jump") return releaseJump(e); e.preventDefault(); keys[act]=false; };
  btn.addEventListener("touchstart", on, {passive:false});
  btn.addEventListener("touchend", off, {passive:false});
  btn.addEventListener("touchcancel", off, {passive:false});
  btn.addEventListener("mousedown", on);
  btn.addEventListener("mouseup", off);
  btn.addEventListener("mouseleave", off);
});

window.addEventListener("keydown", e=>{
  if(["ArrowLeft","a","A"].includes(e.key)) keys.left=true;
  if(["ArrowRight","d","D"].includes(e.key)) keys.right=true;
  if(["ArrowUp","w","W"," "].includes(e.key)) { keys.jump=true; player.jumpBuffer=8; }
});
window.addEventListener("keyup", e=>{
  if(["ArrowLeft","a","A"].includes(e.key)) keys.left=false;
  if(["ArrowRight","d","D"].includes(e.key)) keys.right=false;
  if(["ArrowUp","w","W"," "].includes(e.key)) { keys.jump=false; if(player.vy < -6) player.vy = -6; }
});

function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function addParticles(x,y,color,count=8,spread=4){
  for(let i=0;i<count;i++) state.particles.push({x,y,vx:(Math.random()-.5)*spread,vy:(Math.random()-1.1)*spread,life:24,color,size:2+Math.random()*3});
}
function addText(x,y,text,color,size=22){
  state.texts.push({x,y,text,life:34,color,size});
}

function update(){
  if(!running) return;
  state.time++;
  player.blink--;
  if(player.blink < -8) player.blink = 120 + Math.random()*140;
  state.comboTimer = Math.max(0, state.comboTimer-1);
  if(state.comboTimer===0) state.combo = 0;

  if(!state.win){
    if(keys.left){ player.vx -= player.accel; player.facing=-1; }
    if(keys.right){ player.vx += player.accel; player.facing=1; }
    if(!keys.left && !keys.right) player.vx *= player.friction;
    player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  } else {
    player.vx *= 0.9;
  }

  player.jumpBuffer = Math.max(0, player.jumpBuffer-1);
  if(player.onGround) player.coyote=8; else player.coyote=Math.max(0, player.coyote-1);

  if(player.jumpBuffer>0 && player.coyote>0){
    player.vy = player.jump;
    player.onGround = false;
    player.jumpBuffer = 0;
    player.coyote = 0;
    player.squashX = 0.82;
    player.squashY = 1.24;
    addParticles(player.x+player.w/2, player.y+player.h, "rgba(255,190,220,.9)", 10, 5);
  }

  // mario-ish gravity with slight hang
  if(player.vy < -2) player.vy += 0.56;
  else if(player.vy < 0) player.vy += 0.48;
  else player.vy += 0.98;
  if(player.vy > 18) player.vy = 18;

  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  for(const p of world.platforms){
    if(overlap(player,p)){
      const prevBottom = player.y + player.h - player.vy;
      if(prevBottom <= p.y && player.vy >= 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  if(player.onGround && !player.wasOnGround){
    player.landedAt = state.time;
    player.squashX = 1.26;
    player.squashY = 0.76;
    addParticles(player.x+player.w/2, player.y+player.h, "rgba(223,190,140,.8)", 14, 6);
    state.shake = Math.max(state.shake, 4.8);
  }
  player.wasOnGround = player.onGround;
  player.squashX += (1 - player.squashX) * 0.18;
  player.squashY += (1 - player.squashY) * 0.18;

  for(const e of world.enemies){
    if(!e.alive) continue;
    e.x += e.dir * 1.6;
    e.bob += 0.22;
    if(e.x < e.min || e.x > e.max) e.dir *= -1;
    if(overlap(player,e)){
      const stomp = player.vy > 2 && player.y + player.h - e.y < 24;
      if(stomp){
        e.alive = false;
        player.vy = -12.4;
        state.shake = 7;
        addParticles(e.x+e.w/2, e.y+e.h/2, "rgba(255,110,110,.9)", 18, 8);
        addText(e.x-12, e.y-10, "BONK!", "#ffd5d5", 24);
      } else {
        player.lives = Math.max(1, player.lives-1);
        player.x = Math.max(0, player.x - 58);
        player.vx = -2.5 * player.facing;
        state.shake = 5;
        addText(player.x, player.y-10, "-1 ❤️", "#ffd5d5");
      }
    }
  }

  for(const c of world.coins){
    c.pulse += 0.18;
    c.spin += 0.22;
    if(c.collected) continue;
    const dx = player.x + player.w/2 - c.x;
    const dy = player.y + player.h/2 - c.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 88) c.magnet = true;
    if(c.magnet){
      c.x += dx * 0.2;
      c.y += dy * 0.2;
    }
    if(dist < 34){
      c.collected = true;
      player.coins += 1;
      state.combo += 1;
      state.comboTimer = 45;
      addParticles(c.x, c.y, "rgba(255,220,90,.98)", 16, 8);
      addText(c.x-8,c.y-12,"+1","#ffe173",22);
      if(state.combo >= 3) addText(c.x-4, c.y-36, "x"+state.combo, "#fff1ae", 18);
      state.shake = Math.max(state.shake, 2.8);
    }
  }

  if(!state.win && player.x > world.goalX){
    state.win = true;
    addText(world.goalX, groundY-90, "DU VANDT ❤️", "#ffffff", 30);
    addParticles(world.goalX+40, groundY-60, "rgba(255,180,210,.95)", 32, 8);
    showMessage("Du nåede målet ❤️", 2200);
  }

  for(const p of state.particles){ p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 1; }
  state.particles = state.particles.filter(p=>p.life>0);
  for(const t of state.texts){ t.y -= 0.8; t.life -= 1; }
  state.texts = state.texts.filter(t=>t.life>0);

  if(player.x < 0){ player.x = 0; player.vx = 0; }
  if(player.x > world.width - player.w){ player.x = world.width - player.w; player.vx = 0; }
  if(player.y > canvas.height + 220){
    player.x = Math.max(60, player.x-120);
    player.y = groundY - player.h;
    player.vx = 0;
    player.vy = 0;
  }

  let target = player.x - canvas.width * 0.38;
  target = Math.max(0, Math.min(target, world.width - canvas.width));
  state.cameraX += (target - state.cameraX) * 0.11;

  livesEl.textContent = player.lives;
  coinsEl.textContent = player.coins;
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,"#261341");
  sky.addColorStop(0.42,"#5e35a5");
  sky.addColorStop(1,"#d7a2ba");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const sunX = canvas.width*0.78, sunY = 150;
  const sun = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,150);
  sun.addColorStop(0,"rgba(255,246,195,.98)");
  sun.addColorStop(.3,"rgba(255,223,148,.52)");
  sun.addColorStop(1,"rgba(255,223,148,0)");
  ctx.fillStyle = sun;
  ctx.fillRect(sunX-180, sunY-180, 360, 360);

  ctx.save();
  ctx.translate(-(state.cameraX*0.10),0);
  for(let i=0;i<8;i++){
    const bx=i*540-100;
    ctx.fillStyle=i%2?"rgba(88,43,128,.30)":"rgba(62,25,98,.42)";
    ctx.beginPath();
    ctx.moveTo(bx, canvas.height-160);
    ctx.quadraticCurveTo(bx+170, canvas.height-380, bx+360, canvas.height-160);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = "rgba(255,255,255,.16)";
  for(let i=0;i<10;i++){
    const x=((i*250-state.cameraX*0.14)%(canvas.width+240))-120;
    const y=120+(i%3)*34;
    ctx.beginPath();
    ctx.arc(x,y,32,0,Math.PI*2);
    ctx.arc(x+38,y+10,26,0,Math.PI*2);
    ctx.arc(x-28,y+12,22,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = "rgba(217,190,244,.40)";
  ctx.fillRect(0, canvas.height-194, canvas.width, 78);
  ctx.fillStyle = "rgba(240,214,255,.22)";
  ctx.fillRect(0, canvas.height-158, canvas.width, 16);

  const sand = ctx.createLinearGradient(0, canvas.height-160, 0, canvas.height);
  sand.addColorStop(0, "#eccb9d");
  sand.addColorStop(.55, "#d8b17c");
  sand.addColorStop(1, "#c18f58");
  ctx.fillStyle = sand;
  ctx.fillRect(0, canvas.height-160, canvas.width, 200);

  ctx.save();
  ctx.translate(-(state.cameraX*0.18),0);
  for(const px of [140,1330,2480,3770]){
    ctx.fillStyle="rgba(24,10,32,.92)";
    ctx.fillRect(px, canvas.height-300, 10, 140);
    for(let i=0;i<6;i++){
      ctx.save();
      ctx.translate(px+5, canvas.height-300);
      ctx.rotate(-1.05+i*0.38);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(74,-16,132,20);
      ctx.quadraticCurveTo(74,16,0,6);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawPlatform(p){
  if(p.ground){
    ctx.fillStyle="#c99e6a";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#7adc6f";
    ctx.fillRect(p.x,p.y,p.w,20);
    ctx.fillStyle="rgba(255,255,255,.10)";
    for(let x=p.x+30; x<p.x+p.w; x+=95) ctx.fillRect(x, p.y+44, 26, 8);
  } else {
    ctx.fillStyle="#f1d4a6";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#fff0c8";
    ctx.fillRect(p.x,p.y,p.w,16);
  }
}

function drawEnemy(e){
  ctx.save();
  ctx.shadowColor="rgba(255,80,80,.32)";
  ctx.shadowBlur=18;
  const bob = Math.sin(e.bob||0) * 2;
  const squash = 1 + Math.sin(e.bob||0) * 0.1;
  ctx.fillStyle = "#e44646";
  ctx.beginPath();
  ctx.ellipse(e.x + e.w/2, e.y + e.h/2 + bob, e.w/2*squash, e.h/2/squash, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(e.x+12, e.y+10+bob, 7, 7);
  ctx.fillRect(e.x+24, e.y+10+bob, 7, 7);
  ctx.restore();
}

function drawSarah(){
  const idleWave = player.onGround && Math.abs(player.vx) < 0.25 ? Math.sin(state.time*0.09 + player.idleSeed)*1.8 : 0;
  const bob = (!player.onGround && player.vy < 0) ? -2 : (state.time % 40 < 20 ? 0 : 1) + idleWave;
  const drawW = player.w * player.squashX;
  const drawH = player.h * player.squashY;
  const x = player.x + (player.w-drawW)/2;
  const y = player.y + (player.h-drawH) + bob;

  ctx.save();
  if(player.facing === -1){
    ctx.translate(x+drawW,0);
    ctx.scale(-1,1);
    ctx.translate(-x,0);
  }

  ctx.shadowColor="rgba(255,120,180,.28)";
  ctx.shadowBlur=22;

  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.ellipse(x+drawW/2, player.y+player.h-4, 15, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // slight outline readability
  ctx.fillStyle="rgba(80,45,78,.35)";
  ctx.beginPath();
  roundRectPath(x+7, y+3, drawW-14, 30, 10);
  ctx.fill();

  ctx.fillStyle="#9a6437";
  ctx.beginPath();
  roundRectPath(x+8, y+4, drawW-16, 28, 10);
  ctx.fill();

  ctx.fillStyle="#f6dfcf";
  ctx.beginPath();
  roundRectPath(x+12, y+12, drawW-24, 24, 8);
  ctx.fill();

  ctx.fillStyle="#8e5b34";
  ctx.fillRect(x+6, y+20, 8, 24);
  ctx.fillRect(x+drawW-14, y+20, 8, 24);

  ctx.fillStyle="#f2c456";
  ctx.fillRect(x+drawW*0.24, y+24, 3, 3);
  ctx.fillRect(x+drawW*0.71, y+24, 3, 3);

  ctx.fillStyle="#3d2a34";
  if(player.blink > 2){
    ctx.fillRect(x+drawW*0.40, y+22, 3, 3);
    ctx.fillRect(x+drawW*0.56, y+22, 3, 3);
  } else {
    ctx.fillRect(x+drawW*0.40, y+23, 3, 1);
    ctx.fillRect(x+drawW*0.56, y+23, 3, 1);
  }

  ctx.fillStyle="#ef4ea7";
  ctx.fillRect(x+12, y+40, drawW-24, 20);

  const sway = Math.sin(state.time*0.18)*(player.onGround?1.2:0.3);
  ctx.fillStyle="#ecc5ad";
  ctx.fillRect(x+4, y+42+sway, 8, 24);
  ctx.fillRect(x+drawW-12, y+42-sway, 8, 24);

  ctx.fillStyle="#f35aa8";
  ctx.beginPath();
  ctx.moveTo(x+12, y+60);
  ctx.lineTo(x+drawW-12, y+60);
  ctx.lineTo(x+drawW-4, y+drawH-16);
  ctx.lineTo(x+4, y+drawH-16);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="rgba(255,180,220,.32)";
  ctx.fillRect(x+drawW*0.38, y+70, drawW*0.24, drawH*0.26);

  ctx.fillStyle="#ecc5ad";
  const step = Math.abs(player.vx) > 0.5 ? Math.sin(state.time*0.42)*2.4 : 0;
  ctx.fillRect(x+drawW*0.40, y+drawH-16+step, 6, 14-step);
  ctx.fillRect(x+drawW*0.54, y+drawH-16-step, 6, 14+step);

  ctx.fillStyle="#fff";
  ctx.fillRect(x+drawW*0.36, y+drawH-2+step, 10, 5);
  ctx.fillRect(x+drawW*0.50, y+drawH-2-step, 10, 5);

  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
}

function drawGoal(){
  const x = world.goalX + 120;
  ctx.save();
  ctx.fillStyle="#33d37d";
  ctx.fillRect(x, groundY-120, 24, 120);
  ctx.fillStyle="#ff97c8";
  ctx.beginPath();
  ctx.moveTo(x+24, groundY-120);
  ctx.lineTo(x+92, groundY-92);
  ctx.lineTo(x+24, groundY-64);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.88)";
  ctx.font="bold 22px Arial";
  ctx.fillText("Mål", x-8, groundY-140);
  ctx.restore();
}

function drawWorld(){
  ctx.save();
  if(state.shake > 0){
    const sx=(Math.random()-0.5)*state.shake, sy=(Math.random()-0.5)*state.shake*0.6;
    ctx.translate(sx,sy);
    state.shake*=0.82;
    if(state.shake<0.2) state.shake=0;
  }
  ctx.translate(-state.cameraX,0);

  for(const p of world.platforms) drawPlatform(p);

  for(const c of world.coins){
    if(c.collected) continue;
    const glow = 10 + Math.sin(c.pulse)*2;
    const rx = 12 + Math.sin(c.spin)*7;
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 16+glow*0.25, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,220,90,.3)";
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffd84a";
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, Math.max(4,rx), 13, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#ffe89a";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y-8);
    ctx.lineTo(c.x, c.y+8);
    ctx.stroke();
  }

  drawGoal();
  for(const e of world.enemies) if(e.alive) drawEnemy(e);
  drawSarah();

  for(const p of state.particles){
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/24;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
  for(const t of state.texts){
    ctx.globalAlpha=t.life/34;
    ctx.fillStyle=t.color;
    ctx.font=`bold ${t.size||22}px Arial`;
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

function draw(){
  drawBackground();
  if(running) drawWorld();
}

function loop(){
  if(running) update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
