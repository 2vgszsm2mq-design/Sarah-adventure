<!DOCTYPE html>
<html lang="da">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>Sarah Adventure FIX</title>
<style>
body{margin:0;font-family:sans-serif;background:#1a0d2a;color:white}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
button{padding:20px 30px;font-size:24px;border-radius:12px;background:pink;border:none}
canvas{display:block}
.hidden{display:none}
</style>
</head>
<body>

<div id="menu">
  <button id="startBtn">NYT SPIL</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let running = false;

function startGame(){
  console.log("START GAME TRIGGERED");
  running = true;
  menu.classList.add("hidden");
}

const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  startGame();
}, {passive:false});

function loop(){
  if(running){
    ctx.fillStyle = "#442266";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "pink";
    ctx.fillRect(100,200,80,120); // Sarah placeholder
  }
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
