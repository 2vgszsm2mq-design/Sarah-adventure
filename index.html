<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sarah's Adventure ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="menu-screen">
    <div class="menu-overlay"></div>
    <div class="menu-panel">
      <div class="eyebrow">Til min prinsesse Sarah</div>
      <h1>Sarah's Adventure ❤️</h1>
      <div class="sub">ENGINE FIX · Love Beach · stabil mobilversion</div>
      <div class="menu-buttons">
        <button id="newGameBtn">NYT SPIL</button>
      </div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="hudLeft">🛡️ <span id="shield">3</span> · ❤️ Ammo <span id="ammo">3</span> · 🪙 <span id="coins">0</span></div>
    <div id="hudRight">Niveau: Love Beach</div>
  </div>

  <div id="touchControls" class="hidden">
    <div class="left-controls">
      <button class="control" data-action="left">◀</button>
      <button class="control" data-action="right">▶</button>
    </div>
    <div class="right-controls">
      <button class="control" data-action="jump">⤒ Hop</button>
      <button class="control" data-action="attack">❤️ Skyd</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
