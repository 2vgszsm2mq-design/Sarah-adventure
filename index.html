<!DOCTYPE html>
<html lang="da">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta charset="UTF-8">
<title>Sarah’s Adventure ❤️ V5</title>
<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(#2b1055, #7597de);
    font-family: Arial, sans-serif;
    width: 100%;
    height: 100%;
}
canvas { display: block; width: 100vw; height: 100vh; }
.ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
}
.btn {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(4px);
}
.left { left: 20px; }
.right { left: 120px; }
.jump { right: 20px; width: 100px; }
#menu {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(rgba(26,10,40,.18), rgba(26,10,40,.4));
}
.panel {
    width: min(88vw, 760px); padding: 28px 24px; border-radius: 28px; text-align: center;
    color: #fff; background: rgba(27,13,44,.60); border: 2px solid rgba(255,255,255,.15);
}
h1 { margin: 0 0 12px; font-size: clamp(38px, 6vw, 72px); }
.sub { margin: 0 0 22px; font-size: clamp(18px,2vw,24px); }
#startBtn {
    border: none; border-radius: 18px; min-width: 240px; padding: 18px 24px;
    font-size: clamp(22px,2.4vw,30px); font-weight: 800; color: white;
    background: linear-gradient(180deg,#ff90ca,#ff4ca5);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="menu">
  <div class="panel">
    <div style="font-size:clamp(22px,2.8vw,34px);margin-bottom:10px">Til min prinsesse Sarah</div>
    <h1>Sarah's Adventure ❤️</h1>
    <div class="sub">V5 Juice</div>
    <button id="startBtn">NYT SPIL</button>
  </div>
</div>

<canvas id="game"></canvas>
<div class="ui" id="ui"></div>

<div class="btn left" id="leftBtn"></div>
<div class="btn right" id="rightBtn"></div>
<div class="btn jump" id="jumpBtn"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");
const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 60));

let gravity = 0.6;
let running = false;
let keys = { left:false, right:false };
let cameraShake = 0;

let player = {
    x: 100,
    y: 300,
    w: 40,
    h: 60,
    vx: 0,
    vy: 0,
    onGround: false,
    coyote: 0,
    jumpBuffer: 0,
    scale: 1,
    stretch: 1
};

let coins = [];
let enemy;
let score = 0;
let hearts = 3;

function resetGame() {
    player = {
        x: 100, y: 300, w: 40, h: 60, vx: 0, vy: 0,
        onGround: false, coyote: 0, jumpBuffer: 0, scale: 1, stretch: 1
    };
    coins = [
        {x:400,y:300, collected:false, anim:0},
        {x:600,y:250, collected:false, anim:0},
        {x:840,y:220, collected:false, anim:0},
        {x:1080,y:300, collected:false, anim:0}
    ];
    enemy = { x: 700, y: 320, w: 40, h: 40, dir: 1, squash:1, removed:false };
    score = 0;
    hearts = 3;
    cameraShake = 0;
}

function startGame() {
    resetGame();
    running = true;
    menu.classList.add("hidden");
}

startBtn.addEventListener("click", startGame);
startBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    startGame();
}, { passive:false });

function jumpPress(e) {
    if (e) e.preventDefault();
    player.jumpBuffer = 10;
}

function bindHold(id, key) {
    const el = document.getElementById(id);
    const on = (e) => { e.preventDefault(); keys[key] = true; };
    const off = (e) => { e.preventDefault(); keys[key] = false; };
    el.addEventListener("touchstart", on, {passive:false});
    el.addEventListener("touchend", off, {passive:false});
    el.addEventListener("touchcancel", off, {passive:false});
    el.addEventListener("mousedown", on);
    el.addEventListener("mouseup", off);
    el.addEventListener("mouseleave", off);
}
bindHold("leftBtn", "left");
bindHold("rightBtn", "right");

const jumpBtn = document.getElementById("jumpBtn");
jumpBtn.addEventListener("touchstart", jumpPress, {passive:false});
jumpBtn.addEventListener("mousedown", jumpPress);

window.addEventListener("keydown", (e) => {
    if (["ArrowLeft","a","A"].includes(e.key)) keys.left = true;
    if (["ArrowRight","d","D"].includes(e.key)) keys.right = true;
    if (["ArrowUp","w","W"," "].includes(e.key)) player.jumpBuffer = 10;
});
window.addEventListener("keyup", (e) => {
    if (["ArrowLeft","a","A"].includes(e.key)) keys.left = false;
    if (["ArrowRight","d","D"].includes(e.key)) keys.right = false;
});

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update() {
    if (!running) return;

    if (keys.left) player.vx = -5;
    else if (keys.right) player.vx = 5;
    else player.vx *= 0.8;

    if (player.onGround) player.coyote = 10;
    else player.coyote--;

    if (player.jumpBuffer > 0) player.jumpBuffer--;

    if (player.jumpBuffer > 0 && player.coyote > 0) {
        player.vy = -12;
        player.jumpBuffer = 0;
        player.coyote = 0;
        player.scale = 0.7;
        player.stretch = 1.3;
    }

    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;

    if (player.y > 300) {
        if (!player.onGround) {
            player.scale = 1.3;
            player.stretch = 0.7;
            cameraShake = Math.max(cameraShake, 8);
        }
        player.y = 300;
        player.vy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }

    player.scale += (1 - player.scale) * 0.2;
    player.stretch += (1 - player.stretch) * 0.2;

    coins.forEach(c => {
        c.anim += 0.1;
        if (!c.collected &&
            player.x < c.x+20 &&
            player.x+player.w > c.x &&
            player.y < c.y+20 &&
            player.y+player.h > c.y) {
            c.collected = true;
            score++;
            cameraShake = 10;
        }
    });

    if (!enemy.removed) {
        enemy.x += enemy.dir * 2;
        enemy.squash = 0.92 + Math.sin(Date.now()/120) * 0.08;
        if (enemy.x < 500 || enemy.x > 900) enemy.dir *= -1;

        if (rectsOverlap(player.x, player.y, player.w, player.h, enemy.x, enemy.y, enemy.w, enemy.h)) {
            if (player.vy > 0) {
                enemy.removed = true;
                player.vy = -10;
                cameraShake = 15;
            } else {
                hearts = Math.max(0, hearts - 1);
                player.x = 100;
                cameraShake = 20;
            }
        }
    }

    if (cameraShake > 0) cameraShake--;

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0,0,0,canvas.height);
    sky.addColorStop(0,"#261341");
    sky.addColorStop(0.45,"#56309a");
    sky.addColorStop(1,"#d49db4");
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const sun = ctx.createRadialGradient(canvas.width*0.78, 150, 10, canvas.width*0.78, 150, 140);
    sun.addColorStop(0,"rgba(255,245,190,.98)");
    sun.addColorStop(.3,"rgba(255,223,148,.5)");
    sun.addColorStop(1,"rgba(255,223,148,0)");
    ctx.fillStyle = sun;
    ctx.fillRect(canvas.width*0.78-160, -10, 320, 320);

    ctx.fillStyle = "rgba(217,190,244,.40)";
    ctx.fillRect(0, 330, canvas.width, 78);

    const sand = ctx.createLinearGradient(0, 360, 0, canvas.height);
    sand.addColorStop(0, "#eccb9d");
    sand.addColorStop(.55, "#d8b17c");
    sand.addColorStop(1, "#c18f58");
    ctx.fillStyle = sand;
    ctx.fillRect(0, 360, canvas.width, canvas.height-360);

    ctx.fillStyle = "#7adc6f";
    ctx.fillRect(0, 360, canvas.width, 20);
}

function draw() {
    const shakeX = (Math.random()-0.5)*cameraShake;
    const shakeY = (Math.random()-0.5)*cameraShake;

    ctx.save();
    ctx.translate(shakeX, shakeY);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBackground();

    coins.forEach(c => {
        if (!c.collected) {
            const bob = Math.sin(c.anim)*5;
            const glow = 14 + Math.sin(c.anim)*3;
            ctx.fillStyle = "rgba(255,220,120,.25)";
            ctx.beginPath();
            ctx.arc(c.x, c.y + bob, glow, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "gold";
            ctx.beginPath();
            ctx.arc(c.x, c.y + bob, 10, 0, Math.PI*2);
            ctx.fill();
        }
    });

    if (!enemy.removed) {
        ctx.fillStyle = "rgba(255,80,80,.20)";
        ctx.beginPath();
        ctx.arc(enemy.x + enemy.w/2, enemy.y + enemy.h/2, 30, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "red";
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h * enemy.squash);
    }

    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.scale(player.scale, player.stretch);
    ctx.fillStyle = "pink";
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.restore();

    ctx.restore();

    ui.innerText = "❤️ " + hearts + "   🪙 " + score;
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
