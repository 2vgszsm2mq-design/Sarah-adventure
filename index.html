<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sarah's Adventure ❤️ V4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gameWrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="hud">
      <div id="topLeft">
        <span>🛡️ <strong id="shield">3</strong></span>
        <span>❤️ Ammo <strong id="ammo">3</strong></span>
        <span>🪙 <strong id="coins">0</strong></span>
        <span>💌 <strong id="letters">0</strong>/1</span>
      </div>
      <div id="bossBarWrap" class="hidden">
        <div id="bossName">KING CRAB 👑</div>
        <div id="bossBar"><div id="bossBarFill"></div></div>
      </div>
      <div id="topRight">
        <div>Niveau: <strong id="levelName">Love Beach</strong></div>
        <div id="progressLabel">Fremdrift</div>
        <div id="progressBar"><div id="progressFill"></div></div>
      </div>
    </div>

    <div id="comboFloat"></div>
    <div id="bossIntro" class="center-banner hidden">KING CRAB 👑</div>

    <div id="menu" class="overlay visible menu-bg">
      <div class="panel glass title-panel">
        <div class="subtitle">Til min prinsesse Sarah</div>
        <h1>Sarah’s Adventure ❤️</h1>
        <p class="lede">Love Beach · hemmeligt rør · combo-system · Love Power · King Crab boss</p>
        <div class="btn-col big-buttons">
          <button id="newGameBtn">NYT SPIL</button>
          <button id="continueBtn" class="alt">FORTSÆT</button>
        </div>
        <p class="small">Tip: Saml coins hurtigt for combo. Ved x5 får Sarah Love Power i kort tid.</p>
      </div>
    </div>

    <div id="pauseMenu" class="overlay">
      <div class="panel glass">
        <h2>Pause</h2>
        <div class="btn-col">
          <button id="resumeBtn">Fortsæt spil</button>
          <button id="saveBtn" class="alt">Gem nu</button>
          <button id="quitBtn" class="ghost">Til hovedmenu</button>
        </div>
      </div>
    </div>

    <div id="endMenu" class="overlay">
      <div class="panel glass">
        <h2 id="endTitle">Du vandt!</h2>
        <p id="endText"></p>
        <div class="btn-col">
          <button id="restartBtn">Spil igen</button>
          <button id="endMenuBtn" class="ghost">Til hovedmenu</button>
        </div>
      </div>
    </div>

    <div id="touchControls">
      <div class="left-controls">
        <button class="control" data-action="left">◀</button>
        <button class="control" data-action="right">▶</button>
      </div>
      <div class="right-controls">
        <button class="control" data-action="jump">⤒ Hop</button>
        <button class="control attack" data-action="attack">❤️ Skyd</button>
        <button class="control" data-action="pause">❚❚</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
