    {x:430,y:world.groundY-120,w:260,h:78,ground:false},{x:920,y:world.groundY-230,w:240,h:78,ground:false},{x:1580,y:world.groundY-120,w:240,h:78,ground:false},{x:2440,y:world.groundY-120,w:240,h:78,ground:false},{x:3010,y:world.groundY-230,w:240,h:78,ground:false},{x:3720,y:world.groundY-120,w:240,h:78,ground:false}
  ];
  world.coins=[];
  [220,320,420,520,620,820,980,1140,1280,1420,1580,1740,1900,2140,2300,2460,2620,2840,3040,3240,3440,3660,3880,4100,4340].forEach((x,i)=>world.coins.push({x:x,y:i%3===0?world.groundY-260:(i%2===0?world.groundY-86:world.groundY-165),r:18,collected:false,pulse:Math.random()*6.28}));
  world.enemies=[
    {x:1450,y:world.groundY-70,w:92,h:68,min:1320,max:1820,dir:1,alive:true},
    {x:2520,y:world.groundY-70,w:92,h:68,min:2360,max:2780,dir:1,alive:true},
    {x:3380,y:world.groundY-70,w:92,h:68,min:3220,max:3700,dir:1,alive:true},
    {x:4020,y:world.groundY-70,w:92,h:68,min:3900,max:4300,dir:1,alive:true}
  ];
  world.boss={x:4350,y:world.groundY-162,w:250,h:176,hp:18,maxHp:18,alive:true,t:0,dir:1};
  Object.assign(player,{x:160,y:world.groundY-player.h,vx:0,vy:0,coins:0,lives:3,onGround:false,facing:1,invuln:0,wasOnGround:false,squash:1});
  Object.assign(state,{cameraX:0,time:0,shake:0,landFX:[],coinFX:[],hitStop:0});
}
function startGame(){buildWorld();state.running=true;menu.classList.add('hidden');hud.classList.remove('hidden');controls.classList.remove('hidden');}
document.getElementById('startBtn').addEventListener('click',startGame);
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
document.querySelectorAll('.control').forEach(btn=>{const act=btn.dataset.act;const on=e=>{e.preventDefault();keys[act]=true;};const off=e=>{e.preventDefault();keys[act]=false;};btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);});
window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(['ArrowUp','w','W',' '].includes(e.key))keys.jump=true;});
window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(['ArrowUp','w','W',' '].includes(e.key))keys.jump=false;});
function hurt(){if(player.invuln>0)return;player.lives=Math.max(1,player.lives-1);player.invuln=50;state.shake=10;state.hitStop=4;}
function addLandFX(x,y){for(let i=0;i<8;i++)state.landFX.push({x:x,y:y,vx:(Math.random()-.5)*3.5,vy:-Math.random()*2.4-1,life:26});}
function addCoinFX(x,y){for(let i=0;i<10;i++)state.coinFX.push({x:x,y:y,vx:(Math.random()-.5)*4.2,vy:(Math.random()-.9)*4.5,life:22});}
function addHitFX(x,y){for(let i=0;i<12;i++)state.coinFX.push({x:x,y:y,vx:(Math.random()-.5)*5.2,vy:(Math.random()-1)*5,life:18,hit:true});}
function update(){
  if(!state.running)return;
  state.time++;
  if(state.hitStop>0){state.hitStop--;livesEl.textContent=player.lives;coinsEl.textContent=player.coins;return;}
  if(keys.left){player.vx=-player.speed;player.facing=-1;}else if(keys.right){player.vx=player.speed;player.facing=1;}else player.vx*=0.78;
  if(keys.jump&&player.onGround){player.vy=player.jump;player.onGround=false;keys.jump=false;player.squash=.9;}
  player.vy+=player.vy<0?.72:.98;if(player.vy>19)player.vy=19;player.x+=player.vx;player.y+=player.vy;player.onGround=false;
  for(const p of world.platforms){if(overlap(player,p)){const prevBottom=player.y+player.h-player.vy;if(prevBottom<=p.y+22&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}}}
  if(player.onGround&&!player.wasOnGround){addLandFX(player.x+player.w/2,player.y+player.h);player.squash=1.12;player.landedAt=state.time;state.shake=Math.max(state.shake,3);}
  player.wasOnGround=player.onGround;player.squash+=(1-player.squash)*.18;
  for(const e of world.enemies){if(!e.alive)continue;e.x+=e.dir*1.7;if(e.x<e.min||e.x>e.max)e.dir*=-1;if(overlap(player,e)){const stomp=player.vy>2&&player.y+player.h-e.y<34;if(stomp){e.alive=false;player.vy=-10.5;state.shake=4;state.hitStop=2;addHitFX(e.x+24,e.y+24);}else hurt();}}}
  const b=world.boss;
  if(b.alive){b.t+=.05;b.x+=Math.sin(b.t)*.6*b.dir;if(Math.abs(player.x-b.x)<760){bossHud.style.display='block';bossFill.style.width=(b.hp/b.maxHp*100)+'%';}else bossHud.style.display='none';if(overlap(player,b))hurt();const stompBoss=player.vy>2&&overlap(player,b)&&(player.y+player.h-b.y<42);if(stompBoss){b.hp=Math.max(0,b.hp-1);player.vy=-12;state.shake=6;state.hitStop=3;addHitFX(b.x+b.w/2,b.y+40);if(b.hp<=0)b.alive=false;}} else bossHud.style.display='none';
  if(player.x<0)player.x=0;if(player.x>world.width-player.w)player.x=world.width-player.w;if(player.y>canvas.height+220){player.x=160;player.y=world.groundY-player.h;player.vx=0;player.vy=0;}
  for(const c of world.coins){c.pulse+=.08;if(!c.collected&&Math.hypot(player.x+player.w/2-c.x,player.y+player.h/2-c.y)<58){c.collected=true;player.coins+=1;addCoinFX(c.x,c.y);}}
  state.landFX=state.landFX.filter(p=>--p.life>0);state.coinFX=state.coinFX.filter(p=>--p.life>0);
  for(const p of state.landFX){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;}for(const p of state.coinFX){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;}
  if(player.invuln>0)player.invuln--;
  let target=player.x-canvas.width*.44;target=Math.max(0,Math.min(target,world.width-canvas.width));state.cameraX+=(target-state.cameraX)*.095;
  livesEl.textContent=player.lives;coinsEl.textContent=player.coins;
}
function drawBackground(){ctx.drawImage(bgImg,-state.cameraX*.08,0,1536,canvas.height);ctx.drawImage(bgImg,1536-state.cameraX*.08,0,1536,canvas.height);ctx.drawImage(bgImg,3072-state.cameraX*.08,0,1536,canvas.height);}
function drawPlatform(p){const img=p.ground?groundImg:platformImg;let x=p.x;while(x<p.x+p.w-10){const drawW=Math.min(256,p.x+p.w-x);ctx.drawImage(img,0,0,drawW,img.height,x,p.y,drawW,p.h);x+=drawW;}}
function drawEnemy(e){ctx.save();ctx.shadowColor='rgba(255,80,80,.35)';ctx.shadowBlur=18;ctx.drawImage(enemyImg,e.x,e.y,e.w,e.h);ctx.restore();}
function drawWorld(){
  ctx.save();
  if(state.shake>0){const sx=(Math.random()-.5)*state.shake,sy=(Math.random()-.5)*state.shake*.6;ctx.translate(sx,sy);state.shake*=.86;if(state.shake<.2)state.shake=0;}
  ctx.translate(-state.cameraX,0);
  for(const p of world.platforms)drawPlatform(p);
  for(const c of world.coins){if(c.collected)continue;const glow=10+Math.sin(c.pulse)*3;ctx.globalAlpha=.28;ctx.drawImage(coinImg,c.x-glow,c.y-glow,36+glow,36+glow);ctx.globalAlpha=1;ctx.drawImage(coinImg,c.x-18,c.y-18,36,36);}
  for(const e of world.enemies)if(e.alive)drawEnemy(e);
  if(world.boss.alive){const b=world.boss;const bob=Math.sin(b.t)*4;ctx.save();ctx.shadowColor='rgba(255,65,65,.42)';ctx.shadowBlur=30;ctx.drawImage(bossImg,b.x,b.y+bob,b.w,b.h);ctx.restore();}
  for(const p of state.landFX){ctx.fillStyle='rgba(210,170,120,'+(p.life/26)+')';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}
  for(const p of state.coinFX){const alpha=(p.life/(p.hit?18:22));ctx.fillStyle=p.hit?'rgba(255,90,90,'+alpha+')':'rgba(255,220,100,'+alpha+')';ctx.beginPath();ctx.arc(p.x,p.y,p.hit?4:3,0,Math.PI*2);ctx.fill();}
  drawSarah();
  ctx.restore();
}
function drawSarah(){
  const justLanded=state.time-player.landedAt<6;
  const img=(!player.onGround||justLanded)?sarahJump:sarahIdle;
  const drawW=player.w*player.squash, drawH=player.h/player.squash;
  const offsetX=player.x+(player.w-drawW)/2, offsetY=player.y+(player.h-drawH);
  ctx.save();
  if(player.facing===-1){ctx.translate(offsetX+drawW,0);ctx.scale(-1,1);ctx.translate(-offsetX,0);}
  ctx.shadowColor='rgba(255,120,180,.24)';ctx.shadowBlur=18;
  if(!(player.invuln>0&&Math.floor(player.invuln/4)%2===0))ctx.drawImage(img,offsetX,offsetY,drawW,drawH);
  ctx.restore();
}
function loop(){update();drawBackground();if(state.running)drawWorld();requestAnimationFrame(loop);}
loop();
</script></body></html>
