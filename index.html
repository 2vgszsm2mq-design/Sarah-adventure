<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sarah visible fix</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a0d2a;font-family:Arial,Helvetica,sans-serif}
body{position:fixed;inset:0}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:linear-gradient(rgba(20,10,35,.25),rgba(20,10,35,.45)), linear-gradient(#2d1748,#f2a3b4)}
.panel{width:min(88vw,760px);padding:28px 24px;border-radius:28px;text-align:center;color:#fff;background:rgba(27,13,44,.55);border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
h1{margin:0 0 12px;font-size:clamp(38px,6vw,74px)} .sub{margin:0 0 22px;font-size:clamp(18px,2vw,24px)}
button{border:none;border-radius:18px;min-width:240px;padding:18px 24px;font-size:clamp(22px,2.4vw,30px);font-weight:800;color:white;background:linear-gradient(180deg,#ff90ca,#ff4ca5)}
.hidden{display:none!important}
#hud{position:fixed;left:16px;right:16px;top:10px;z-index:11;display:flex;justify-content:space-between;color:white;font-weight:800;font-size:clamp(18px,2vw,22px);text-shadow:0 3px 10px rgba(0,0,0,.52);pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:max(10px, env(safe-area-inset-bottom));z-index:12;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none}
.group{display:flex;gap:12px}
.control{pointer-events:auto;min-width:92px;min-height:66px;padding:12px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.28);color:white;font-weight:800;font-size:20px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div id="menu">
  <div class="panel">
    <div style="font-size:clamp(22px,2.8vw,34px);margin-bottom:10px">Til min prinsesse Sarah</div>
    <h1>Sarah's Adventure ❤️</h1>
    <div class="sub">Embedded sprite fix · Sarah skal være synlig nu</div>
    <button id="startBtn">NYT SPIL</button>
  </div>
</div>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div>❤️ <span id="lives">3</span> · 🪙 <span id="coins">0</span></div><div>Love Beach</div></div>
<div id="controls" class="hidden">
  <div class="group"><button class="control" data-act="left">◀</button><button class="control" data-act="right">▶</button></div>
  <div class="group"><button class="control" data-act="jump">⤒ Hop</button></div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');
const hud = document.getElementById('hud');
const controls = document.getElementById('controls');
const livesEl = document.getElementById('lives');
const coinsEl = document.getElementById('coins');

const sprite = new Image();
sprite.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAABgCAYAAADy8ayIAAAD1ElEQVR4nO3cMZrTRhgGYImH3ABuQJHcgJpia6otOAI1BWlSpEmK1DkCBRX1FtS5QSi4AdyAwmni50mMtWt5/tHM6H/f0vJK+sbi82jY1TQBAAAAAAAAAHsxR+7s7csfD5H7O/X7h0+h5xtNfvlr7r9G/pAd1g5+qrcLQX75tzxeZP4mBfDbH38ubvv5zeuL9tHTRSC//Gve31P+4p2sCX9f8FOXDEQPF4H88l/63h7zb1IAa4KfemggWl8E8sv/0Ht6zv+o5Ie3UDJ4eyC//DV1XwDTdP8gbL0A04L88i8pzT9EAUyTbwL55a9hmAIA4g1VAL4F5M+sRv6hCgCINVwB+BaQP7Po/MMVABBHAUBimxfA0+e3RdtHJ7/8JdujbV4AX/56X7R9dPLLX7I9mlsASEwBQGLVCyD6vy0u/XvpXsgvf6To/GYAkNjjWju+tPmePr/9/8LHtxfT9MPHs+8dqf3ll/8SrfMXzwBKH0jw3arnQvhaxy8lv/wlP986f7VbgOi2Gqn9p0l++cfIH1IASy0UddJL+2nd/kfyy3/u9RHyh80Aag1C7x/+kfzyn3u99/zhg3jfI4qinora24f/X/LLv7Stx/zVBvLagRj1gz8lv/xL23rKv9mAHv6eVj+8cP5pu/OrTX751/7MnvIDAD2pNsU4vHof/rz2+d3tMFMi+eWP3meN/P4WABJTAJBYlQKoMf2pud9o8ss/yn7NACAxBQCJKQBITAFAYuEFUHuhpveFIPlz5x+NGQAEGq0Awwrg5uYmdTPLL3/rc7hGWAHc3d0N82uaNcgvf+tzuEboLcBW92e93gfKnzv/iKwBQGLWAILIL/+IMyBrAEHkl7/1OVzDLQAkFlYAWy/M9LYQJH/u/KMyA4DEFAAEGHUGpAAgMQUAiYUUQKsFmV4WguTPnX9kZgCQmAKAxBQAFBr5FkgBQGLFBdB6IcbxHb/l8UdnBgCJKQBITAFAgda3IKXHLyqA1uGPRl6FjSB/H+cxIjMASOxx6xOAkc3vbod8EtCRGQAkpgAgsasLoLeFl1EfyBBF/r7OZxRmAJBY/UXAX5+cf/2Xr2XvHcHe8tS28/E6fP743SxlfvZiXnp9i3OqfpBz4abpfMA17x3B3vLUtvfx6rEA/DdgZ/b2j2BvefbGGgAkpgAgMQUAiSkASEwBQGIKABJTAJCYAoDEFAAk5jcBKzkcDot/nXbcNs+z34b7l/FqwwwAEqs6A1jT6r4B2LOl6/uh12tf824BKlFW6xivNhRAR/Y2C9pbnj2qWgBrPlwXAnvW6/VtERAAMvoH2XbVa1HAb4MAAAAASUVORK5CYII=";

const keys = {left:false,right:false,jump:false};
const state = {running:false,cameraX:0,time:0};
const world = {width:3400,groundY:0,platforms:[],coins:[]};
const player = {x:160,y:0,w:128,h:192,vx:0,vy:0,speed:5.5,jump:-15,onGround:false,lives:3,coins:0,facing:1};

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  world.groundY = canvas.height - 120;
  if(!state.running) player.y = world.groundY - player.h;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 50));
resizeCanvas();

function buildWorld(){
  world.groundY = canvas.height - 120;
  world.platforms = [
    {x:0,y:world.groundY,w:900,h:140},
    {x:980,y:world.groundY,w:900,h:140},
    {x:1960,y:world.groundY,w:980,h:140},
    {x:420,y:world.groundY-120,w:220,h:18},
    {x:860,y:world.groundY-220,w:220,h:18},
    {x:1500,y:world.groundY-120,w:220,h:18},
    {x:2300,y:world.groundY-120,w:220,h:18},
  ];
  world.coins = [];
  [220,320,420,520,620,780,920,1060,1160,1260,1400,1520,1660,1880,2020,2160,2300,2440].forEach((x,i)=> {
    world.coins.push({x:x, y:i%3===0?world.groundY-250:(i%2===0?world.groundY-80:world.groundY-155), r:12, collected:false});
  });
  player.x = 160; player.y = world.groundY - player.h; player.vx = 0; player.vy = 0; player.coins = 0; player.lives = 3; player.onGround = false;
  state.cameraX = 0;
}

function startGame(){ buildWorld(); state.running = true; menu.classList.add('hidden'); hud.classList.remove('hidden'); controls.classList.remove('hidden'); }
document.getElementById('startBtn').addEventListener('click', startGame);

function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

document.querySelectorAll('.control').forEach(btn => {
  const act = btn.dataset.act;
  const on = e => { e.preventDefault(); keys[act] = true; };
  const off = e => { e.preventDefault(); keys[act] = false; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});
window.addEventListener('keydown', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.jump = true;
});
window.addEventListener('keyup', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.jump = false;
});

function update(){
  if(!state.running) return;
  state.time++;
  if(keys.left) { player.vx = -5.5; player.facing = -1; }
  else if(keys.right) { player.vx = 5.5; player.facing = 1; }
  else player.vx *= 0.75;

  if(keys.jump && player.onGround) {
    player.vy = player.jump; player.onGround = false; keys.jump = false;
  }

  player.vy += 0.85; if(player.vy > 18) player.vy = 18;
  player.x += player.vx; player.y += player.vy; player.onGround = false;

  for(const p of world.platforms){
    if(overlap(player,p)) {
      const prevBottom = player.y + player.h - player.vy;
      if(prevBottom <= p.y + 18 && player.vy >= 0) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
      }
    }
  }

  if(player.x < 0) player.x = 0;
  if(player.x > world.width - player.w) player.x = world.width - player.w;
  if(player.y > canvas.height + 200) {
    player.x = 160; player.y = world.groundY - player.h; player.vx = 0; player.vy = 0;
  }

  for(const c of world.coins){
    if(!c.collected && Math.hypot(player.x + player.w/2 - c.x, player.y + player.h/2 - c.y) < 46){
      c.collected = true; player.coins += 1;
    }
  }

  let target = player.x - canvas.width * 0.38;
  target = Math.max(0, Math.min(target, world.width - canvas.width));
  state.cameraX += (target - state.cameraX) * 0.12;

  livesEl.textContent = player.lives;
  coinsEl.textContent = player.coins;
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,'#2d1748'); sky.addColorStop(0.55,'#6c39a5'); sky.addColorStop(1,'#f2a3b4');
  ctx.fillStyle = sky; ctx.fillRect(0,0,canvas.width,canvas.height);

  const sunX = canvas.width * 0.78, sunY = 150;
  const sun = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,100);
  sun.addColorStop(0,'rgba(255,244,184,.94)'); sun.addColorStop(.35,'rgba(255,219,140,.44)'); sun.addColorStop(1,'rgba(255,219,140,0)');
  ctx.fillStyle = sun; ctx.fillRect(sunX-110, sunY-110, 220, 220);

  ctx.fillStyle = 'rgba(255,209,224,.42)';
  ctx.fillRect(0, canvas.height - 190, canvas.width, 200);

  const sand = ctx.createLinearGradient(0, canvas.height - 160, 0, canvas.height);
  sand.addColorStop(0, '#e8c89d'); sand.addColorStop(1, '#c79a63');
  ctx.fillStyle = sand; ctx.fillRect(0, canvas.height - 160, canvas.width, 200);
}

function drawWorld(){
  ctx.save();
  ctx.translate(-state.cameraX, 0);

  for(const p of world.platforms){
    ctx.fillStyle = p.y >= world.groundY ? '#d7af79' : '#efce98';
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle = p.y >= world.groundY ? '#75d767' : '#ffe0af';
    ctx.fillRect(p.x,p.y,p.w,18);
  }

  for(const c of world.coins){
    if(c.collected) continue;
    ctx.fillStyle = 'rgba(255,231,150,.22)';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r+9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill();
  }

  drawSarah();
  ctx.restore();
}

function drawSarah(){
  const frameW = 64, frameH = 96;
  let frame = 0;
  if(!player.onGround) frame = 3;
  else if(Math.abs(player.vx) > 0.8) frame = (Math.floor(state.time / 8) % 2) + 1;
  else frame = 0;

  ctx.save();
  if(player.facing === -1) {
    ctx.translate(player.x + player.w, 0);
    ctx.scale(-1, 1);
    ctx.translate(-player.x, 0);
  }
  ctx.shadowColor = 'rgba(255,120,180,.24)';
  ctx.shadowBlur = 18;
  ctx.drawImage(sprite, frame*frameW, 0, frameW, frameH, player.x, player.y, player.w, player.h);
  ctx.restore();
}

function loop(){ update(); drawBackground(); if(state.running) drawWorld(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
