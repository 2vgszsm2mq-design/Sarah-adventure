<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sarah's Adventure ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="rotateNotice" class="hidden">Drej telefonen vandret for den bedste oplevelse 📱</div>
  <div id="gameWrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="hud">
      <div id="topLeft">🛡️ <span id="shield">3</span> · ❤️ Ammo <span id="ammo">3</span> · 🪙 <span id="coins">0</span> · 💌 <span id="letters">0</span>/1</div>
      <div id="topRight">Niveau: <span id="levelName">Love Beach</span></div>
    </div>

    <div id="bossHud" class="hidden">
      <div id="bossName">KING CRAB 👑</div>
      <div id="bossBar"><div id="bossFill"></div></div>
    </div>

    <div id="comboFloat" class="hidden">x2 COMBO!</div>

    <div id="menu" class="overlay visible menu-bg">
      <div class="panel title-panel glass">
        <div class="subtitle">Til min prinsesse Sarah</div>
        <div class="btn-col big-buttons">
          <button id="newGameBtn">NYT SPIL</button>
          <button id="continueBtn" class="alt">FORTSÆT</button>
          <button id="settingsBtn" class="ghost">INDSTILLINGER</button>
        </div>
        <p class="small">Love Beach · King Crab boss · pause · gem · touch controls</p>
      </div>
    </div>

    <div id="intro" class="overlay intro-screen">
      <div class="panel glass intro-panel">
        <h1>Sarah’s Adventure ❤️</h1>
        <p>Til min prinsesse Sarah</p>
        <button id="skipIntroBtn">Spring over</button>
      </div>
    </div>

    <div id="pauseMenu" class="overlay">
      <div class="panel glass">
        <h2>Pause</h2>
        <div class="btn-col">
          <button id="resumeBtn">Fortsæt spil</button>
          <button id="saveBtn">Gem nu</button>
          <button id="quitBtn" class="ghost">Til hovedmenu</button>
        </div>
      </div>
    </div>

    <div id="endMenu" class="overlay">
      <div class="panel glass">
        <h2 id="endTitle">Du vandt!</h2>
        <p id="endText"></p>
        <div class="btn-col">
          <button id="restartBtn">Spil igen</button>
          <button id="endMenuBtn" class="ghost">Til hovedmenu</button>
        </div>
      </div>
    </div>

    <div id="touchControls">
      <div class="left-controls">
        <button class="control" data-action="left">◀</button>
        <button class="control" data-action="right">▶</button>
      </div>
      <div class="right-controls">
        <button class="control" data-action="jump">⤒ Hop</button>
        <button class="control" data-action="attack">❤️ Skyd</button>
        <button class="control" data-action="pause">❚❚</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
