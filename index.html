<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarah V3 Visual</title>
<style>
body{margin:0;overflow:hidden;background:#120824}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;

let t=0;
let player={x:200,y:300,vx:0};

function loop(){
t+=0.016;

// background glow
let g=x.createLinearGradient(0,0,0,c.height);
g.addColorStop(0,'#2d1748');
g.addColorStop(1,'#f2a3b4');
x.fillStyle=g;
x.fillRect(0,0,c.width,c.height);

// sun glow
x.beginPath();
x.arc(c.width*0.8,150,80,0,Math.PI*2);
x.fillStyle="rgba(255,200,120,0.4)";
x.fill();

// ground
x.fillStyle="#d7af79";
x.fillRect(0,c.height-120,c.width,120);

// PLAYER (BIG + GLOW)
x.save();
x.shadowColor="rgba(255,100,180,0.8)";
x.shadowBlur=40;
x.fillStyle="#ff69b4";
x.fillRect(player.x, c.height-220, 120, 160);
x.restore();

// BOSS
x.save();
x.shadowColor="red";
x.shadowBlur=30;
x.fillStyle="#aa2222";
x.fillRect(c.width-200, c.height-200, 140, 140);
x.restore();

// boss hp bar
x.fillStyle="#fff";
x.fillRect(c.width-220,40,180,20);
x.fillStyle="red";
x.fillRect(c.width-220,40,140,20);

requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
