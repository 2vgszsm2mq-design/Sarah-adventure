<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sarah's Adventure – clean fix</title>
<style>
html,body{
  margin:0; width:100%; height:100%; overflow:hidden;
  background:#1f1033; font-family:Arial,Helvetica,sans-serif;
}
body{position:fixed; inset:0; overscroll-behavior:none;}
#game{position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:1;}
#menu{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  z-index:10; background:linear-gradient(#2d1748,#9a6c93);
}
.panel{
  width:min(88vw,760px); padding:28px 24px; border-radius:28px; text-align:center;
  color:#fff; background:rgba(27,13,44,.60); border:2px solid rgba(255,255,255,.15);
}
h1{margin:0 0 10px; font-size:clamp(38px,6vw,72px);}
.sub{margin:0 0 22px; font-size:clamp(18px,2vw,24px);}
#startBtn{
  border:none; border-radius:18px; min-width:240px; padding:18px 24px;
  font-size:clamp(22px,2.4vw,30px); font-weight:800; color:white;
  background:linear-gradient(180deg,#ff90ca,#ff4ca5);
}
.hidden{display:none !important;}
#hud{
  position:fixed; left:16px; right:16px; top:10px; z-index:11;
  display:flex; justify-content:space-between; color:white; font-weight:800;
  font-size:clamp(18px,2vw,22px); text-shadow:0 3px 10px rgba(0,0,0,.52);
  pointer-events:none;
}
#controls{
  position:fixed; left:0; right:0; bottom:max(10px, env(safe-area-inset-bottom));
  z-index:12; display:flex; justify-content:space-between; padding:12px 16px;
  pointer-events:none;
}
.group{display:flex; gap:12px;}
.control{
  pointer-events:auto; min-width:92px; min-height:66px; padding:12px 14px;
  border-radius:18px; border:1px solid rgba(255,255,255,.28); color:white;
  font-weight:800; font-size:20px; background:rgba(255,255,255,.22);
}
</style>
</head>
<body>
<div id="menu">
  <div class="panel">
    <div style="font-size:clamp(22px,2.8vw,34px);margin-bottom:10px">Til min prinsesse Sarah</div>
    <h1>Sarah's Adventure ❤️</h1>
    <div class="sub">Clean fix – menu, start og spil skal virke nu</div>
    <button id="startBtn">NYT SPIL</button>
  </div>
</div>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div>❤️ <span id="lives">3</span> · 🪙 <span id="coins">0</span></div>
  <div>Love Beach</div>
</div>

<div id="controls" class="hidden">
  <div class="group">
    <button class="control" data-act="left">◀</button>
    <button class="control" data-act="right">▶</button>
  </div>
  <div class="group">
    <button class="control" data-act="jump">⤒ Hop</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const controls = document.getElementById("controls");
const livesEl = document.getElementById("lives");
const coinsEl = document.getElementById("coins");
const startBtn = document.getElementById("startBtn");

let groundY = 0;
const keys = { left:false, right:false, jump:false };
const state = { running:false, cameraX:0, time:0 };

const player = {
  x: 120, y: 0, w: 56, h: 96,
  vx: 0, vy: 0, speed: 5.5, jump: -15.5,
  onGround: false, lives: 3, coins: 0, facing: 1
};

const world = {
  width: 2600,
  platforms: [],
  coins: [],
  enemies: []
};

function resizeCanvas(){
  canvas.width = Math.max(1, window.innerWidth);
  canvas.height = Math.max(1, window.innerHeight);
  groundY = canvas.height - 120;
  if (!state.running) player.y = groundY - player.h;
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 50));
resizeCanvas();

function buildWorld(){
  world.platforms = [
    {x:0, y:groundY, w:900, h:140, ground:true},
    {x:980, y:groundY, w:920, h:140, ground:true},
    {x:1980, y:groundY, w:720, h:140, ground:true},
    {x:420, y:groundY-120, w:220, h:18, ground:false},
    {x:860, y:groundY-220, w:220, h:18, ground:false},
    {x:1460, y:groundY-120, w:220, h:18, ground:false},
  ];
  world.coins = [];
  [260,360,460,580,700,900,1040,1200,1400,1560,1720,1940,2160,2380].forEach((x,i)=>{
    world.coins.push({
      x, y: i % 2 === 0 ? groundY - 86 : groundY - 170,
      r: 12, collected:false, pulse: Math.random() * Math.PI * 2
    });
  });
  world.enemies = [
    {x:1140, y:groundY-46, w:46, h:46, min:1040, max:1320, dir:1, alive:true},
    {x:2080, y:groundY-46, w:46, h:46, min:1980, max:2260, dir:1, alive:true}
  ];

  player.x = 120;
  player.y = groundY - player.h;
  player.vx = 0;
  player.vy = 0;
  player.coins = 0;
  player.lives = 3;
  player.onGround = false;
  player.facing = 1;
  state.cameraX = 0;
  state.time = 0;
}

function startGame(){
  buildWorld();
  state.running = true;
  menu.classList.add("hidden");
  hud.classList.remove("hidden");
  controls.classList.remove("hidden");
}

startBtn.addEventListener("click", startGame);
startBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  startGame();
}, { passive:false });

document.querySelectorAll(".control").forEach(btn => {
  const act = btn.dataset.act;
  const on = e => { e.preventDefault(); keys[act] = true; };
  const off = e => { e.preventDefault(); keys[act] = false; };
  btn.addEventListener("touchstart", on, { passive:false });
  btn.addEventListener("touchend", off, { passive:false });
  btn.addEventListener("touchcancel", off, { passive:false });
  btn.addEventListener("mousedown", on);
  btn.addEventListener("mouseup", off);
  btn.addEventListener("mouseleave", off);
});

window.addEventListener("keydown", e => {
  if (["ArrowLeft","a","A"].includes(e.key)) keys.left = true;
  if (["ArrowRight","d","D"].includes(e.key)) keys.right = true;
  if (["ArrowUp","w","W"," "].includes(e.key)) keys.jump = true;
});
window.addEventListener("keyup", e => {
  if (["ArrowLeft","a","A"].includes(e.key)) keys.left = false;
  if (["ArrowRight","d","D"].includes(e.key)) keys.right = false;
  if (["ArrowUp","w","W"," "].includes(e.key)) keys.jump = false;
});

function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function update(){
  if (!state.running) return;

  state.time++;

  if (keys.left) { player.vx = -player.speed; player.facing = -1; }
  else if (keys.right) { player.vx = player.speed; player.facing = 1; }
  else player.vx *= 0.75;

  if (keys.jump && player.onGround){
    player.vy = player.jump;
    player.onGround = false;
    keys.jump = false;
  }

  player.vy += player.vy < 0 ? 0.72 : 0.95;
  if (player.vy > 18) player.vy = 18;

  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  for (const p of world.platforms){
    if (overlap(player, p)){
      const prevBottom = player.y + player.h - player.vy;
      if (prevBottom <= p.y + 18 && player.vy >= 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  for (const e of world.enemies){
    if (!e.alive) continue;
    e.x += e.dir * 1.4;
    if (e.x < e.min || e.x > e.max) e.dir *= -1;
    if (overlap(player, e)){
      const stomp = player.vy > 2 && player.y + player.h - e.y < 28;
      if (stomp){
        e.alive = false;
        player.vy = -9;
      } else {
        player.lives = Math.max(1, player.lives - 1);
        player.x = Math.max(0, player.x - 36);
      }
    }
  }

  for (const c of world.coins){
    c.pulse += 0.08;
    if (!c.collected && Math.hypot(player.x + player.w/2 - c.x, player.y + player.h/2 - c.y) < 42){
      c.collected = true;
      player.coins += 1;
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x > world.width - player.w) player.x = world.width - player.w;
  if (player.y > canvas.height + 200){
    player.x = 120;
    player.y = groundY - player.h;
    player.vx = 0;
    player.vy = 0;
  }

  let target = player.x - canvas.width * 0.36;
  target = Math.max(0, Math.min(target, world.width - canvas.width));
  state.cameraX += (target - state.cameraX) * 0.12;

  livesEl.textContent = player.lives;
  coinsEl.textContent = player.coins;
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,"#2d1748");
  sky.addColorStop(0.55,"#6c39a5");
  sky.addColorStop(1,"#d08aa8");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const sunX = canvas.width * 0.78;
  const sunY = 150;
  const sun = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,110);
  sun.addColorStop(0,"rgba(255,244,184,.95)");
  sun.addColorStop(.35,"rgba(255,219,140,.46)");
  sun.addColorStop(1,"rgba(255,219,140,0)");
  ctx.fillStyle = sun;
  ctx.fillRect(sunX-120, sunY-120, 240, 240);

  ctx.save();
  ctx.translate(-(state.cameraX * 0.10), 0);
  for (let i=0;i<6;i++){
    const bx = i*480 - 60;
    ctx.fillStyle = i % 2 ? "rgba(80,34,112,.28)" : "rgba(60,24,92,.36)";
    ctx.beginPath();
    ctx.moveTo(bx, canvas.height - 160);
    ctx.quadraticCurveTo(bx+130, canvas.height - 360, bx+280, canvas.height - 160);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = "rgba(255,255,255,.14)";
  for (let i=0;i<7;i++){
    const x = ((i*290 - state.cameraX*0.14) % (canvas.width+220)) - 100;
    const y = 120 + (i%3)*34;
    ctx.beginPath();
    ctx.arc(x,y,30,0,Math.PI*2);
    ctx.arc(x+36,y+8,24,0,Math.PI*2);
    ctx.arc(x-28,y+10,22,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = "rgba(214,185,240,.38)";
  ctx.fillRect(0, canvas.height - 188, canvas.width, 74);

  const sand = ctx.createLinearGradient(0, canvas.height - 160, 0, canvas.height);
  sand.addColorStop(0, "#e8c89d");
  sand.addColorStop(1, "#c79a63");
  ctx.fillStyle = sand;
  ctx.fillRect(0, canvas.height - 160, canvas.width, 200);
}

function drawPlatform(p){
  if (p.ground){
    ctx.fillStyle = "#d7af79";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#75d767";
    ctx.fillRect(p.x, p.y, p.w, 18);
  } else {
    ctx.fillStyle = "#efce98";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#ffe0af";
    ctx.fillRect(p.x, p.y, p.w, 18);
  }
}

function drawEnemy(e){
  ctx.save();
  ctx.shadowColor = "rgba(255,80,80,.35)";
  ctx.shadowBlur = 16;
  ctx.fillStyle = "#d33b3b";
  ctx.beginPath();
  ctx.arc(e.x + e.w/2, e.y + e.h/2, 22, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(e.x + 12, e.y + 12, 8, 8);
  ctx.fillRect(e.x + 26, e.y + 12, 8, 8);
  ctx.restore();
}

function drawSarah(){
  ctx.save();
  if (player.facing === -1){
    ctx.translate(player.x + player.w, 0);
    ctx.scale(-1, 1);
    ctx.translate(-player.x, 0);
  }
  ctx.fillStyle = "#efb3c0";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.restore();
}

function drawWorld(){
  ctx.save();
  ctx.translate(-state.cameraX, 0);

  for (const p of world.platforms) drawPlatform(p);

  for (const c of world.coins){
    if (c.collected) continue;
    const glow = 9 + Math.sin(c.pulse) * 2;
    ctx.fillStyle = "rgba(255,231,150,.22)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + glow, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#ffd84d";
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.fill();
  }

  for (const e of world.enemies) if (e.alive) drawEnemy(e);
  drawSarah();

  ctx.restore();
}

function loop(){
  update();
  drawBackground();
  if (state.running) drawWorld();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
