  ];
  world.coins = [];
  [220,320,420,520,620,820,980,1140,1280,1420,1580,1740,1900,2140,2300,2460,2620,2840,3040,3240,3440,3660,3880,4100,4340].forEach((x,i)=> {
    world.coins.push({x:x, y:i%3===0?world.groundY-260:(i%2===0?world.groundY-86:world.groundY-165), r:12, collected:false, pulse:Math.random()*6.28});
  });
  world.enemies = [
    {x:1450,y:world.groundY-48,w:60,h:48,min:1320,max:1820,dir:1,alive:true},
    {x:2520,y:world.groundY-48,w:60,h:48,min:2360,max:2780,dir:1,alive:true},
    {x:3380,y:world.groundY-48,w:60,h:48,min:3220,max:3700,dir:1,alive:true},
    {x:4020,y:world.groundY-48,w:60,h:48,min:3900,max:4300,dir:1,alive:true},
  ];
  world.boss = {x: 4350, y: world.groundY - 162, w: 250, h: 176, hp: 18, maxHp: 18, alive: true, t:0, dir:1};
  player.x = 160; player.y = world.groundY - player.h; player.vx = 0; player.vy = 0; player.coins = 0; player.lives = 3; player.onGround = false; player.facing = 1; player.invuln = 0; player.wasOnGround = false; player.squash = 1;
  state.cameraX = 0; state.time = 0; state.shake = 0; state.landFX = []; state.coinFX = []; state.hitStop = 0;
}

function startGame(){ buildWorld(); state.running = true; menu.classList.add('hidden'); hud.classList.remove('hidden'); controls.classList.remove('hidden'); }
document.getElementById('startBtn').addEventListener('click', startGame);

function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

document.querySelectorAll('.control').forEach(btn => {
  const act = btn.dataset.act;
  const on = e => { e.preventDefault(); keys[act] = true; };
  const off = e => { e.preventDefault(); keys[act] = false; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});
window.addEventListener('keydown', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.jump = true;
});
window.addEventListener('keyup', e => {
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
  if(['ArrowUp','w','W',' '].includes(e.key)) keys.jump = false;
});

function hurt() {
  if(player.invuln > 0) return;
  player.lives = Math.max(1, player.lives - 1);
  player.invuln = 50;
  state.shake = 10;
  state.hitStop = 4;
}

function addLandFX(x,y) {
  for(let i=0;i<8;i++) state.landFX.push({x:x,y:y,vx:(Math.random()-0.5)*3.5,vy:-Math.random()*2.4-1,life:26});
}
function addCoinFX(x,y) {
  for(let i=0;i<10;i++) state.coinFX.push({x:x,y:y,vx:(Math.random()-0.5)*4.2,vy:(Math.random()-0.9)*4.5,life:22});
}
function addHitFX(x,y) {
  for(let i=0;i<12;i++) state.coinFX.push({x:x,y:y,vx:(Math.random()-0.5)*5.2,vy:(Math.random()-1.0)*5.0,life:18,hit:true});
}

function update(){
  if(!state.running) return;
  state.time++;
  if(state.hitStop > 0) {
    state.hitStop--;
    livesEl.textContent = player.lives;
    coinsEl.textContent = player.coins;
    return;
  }

  if(keys.left) { player.vx = -player.speed; player.facing = -1; }
  else if(keys.right) { player.vx = player.speed; player.facing = 1; }
  else player.vx *= 0.78;

  if(keys.jump && player.onGround) {
    player.vy = player.jump; player.onGround = false; keys.jump = false;
    player.squash = 0.9;
  }

  // jump arc feel
  player.vy += player.vy < 0 ? 0.72 : 0.98;
  if(player.vy > 19) player.vy = 19;

  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  for(const p of world.platforms){
    if(overlap(player,p)) {
      const prevBottom = player.y + player.h - player.vy;
      if(prevBottom <= p.y + 18 && player.vy >= 0) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
      }
    }
  }

  if(player.onGround && !player.wasOnGround) {
    addLandFX(player.x + player.w/2, player.y + player.h);
    player.squash = 1.12;
    player.landedAt = state.time;
    state.shake = Math.max(state.shake, 3);
  }
  player.wasOnGround = player.onGround;
  player.squash += (1 - player.squash) * 0.18;

  for(const e of world.enemies){
    if(!e.alive) continue;
    e.x += e.dir * 1.7;
    if(e.x < e.min || e.x > e.max) e.dir *= -1;
    if(overlap(player,e)){
      const stomp = player.vy > 2 && player.y + player.h - e.y < 34;
      if(stomp) {
        e.alive = false;
        player.vy = -10.5;
        state.shake = 4;
        state.hitStop = 2;
        addHitFX(e.x+24, e.y+24);
      } else {
        hurt();
      }
    }
  }

  const b = world.boss;
  if(b.alive) {
    b.t += 0.05;
    // hover patrol
    b.x += Math.sin(b.t) * 0.6 * b.dir;
    if(Math.abs(player.x - b.x) < 760) {
      bossHud.style.display = 'block';
      bossFill.style.width = (b.hp / b.maxHp * 100) + '%';
    } else {
      bossHud.style.display = 'none';
    }
    if(overlap(player,b)) hurt();

    // stomp boss from above to damage
    const stompBoss = player.vy > 2 && overlap(player,b) && (player.y + player.h - b.y < 42);
    if(stompBoss){
      b.hp = Math.max(0, b.hp - 1);
      player.vy = -12;
      state.shake = 6;
      state.hitStop = 3;
      addHitFX(b.x + b.w/2, b.y + 40);
      if(b.hp <= 0) b.alive = false;
    }
  } else {
    bossHud.style.display = 'none';
  }

  if(player.x < 0) player.x = 0;
  if(player.x > world.width - player.w) player.x = world.width - player.w;
  if(player.y > canvas.height + 220) {
    player.x = 160; player.y = world.groundY - player.h; player.vx = 0; player.vy = 0;
  }

  for(const c of world.coins){
    c.pulse += 0.08;
    if(!c.collected && Math.hypot(player.x + player.w/2 - c.x, player.y + player.h/2 - c.y) < 58){
      c.collected = true; player.coins += 1; addCoinFX(c.x,c.y);
    }
  }

  state.landFX = state.landFX.filter(p => --p.life > 0);
  state.coinFX = state.coinFX.filter(p => --p.life > 0);
  for(const p of state.landFX){ p.x += p.vx; p.y += p.vy; p.vy += 0.06; }
  for(const p of state.coinFX){ p.x += p.vx; p.y += p.vy; p.vy += 0.08; }

  if(player.invuln > 0) player.invuln--;

  let target = player.x - canvas.width * 0.44;
  target = Math.max(0, Math.min(target, world.width - canvas.width));
  state.cameraX += (target - state.cameraX) * 0.095;

  livesEl.textContent = player.lives;
  coinsEl.textContent = player.coins;
}

function drawPalm(x,baseY,h){
  ctx.fillStyle = 'rgba(24,10,32,.92)';
  ctx.fillRect(x-5, baseY-h, 10, h);
  for(let i=0;i<6;i++){
    ctx.save();
    ctx.translate(x, baseY-h);
    ctx.rotate(-1.05 + i*0.4 + Math.sin(state.time*0.03 + i)*0.03);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(74,-16,136,22);
    ctx.quadraticCurveTo(74,18,0,8);
    ctx.fill();
    ctx.restore();
  }
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,'#2d1748'); sky.addColorStop(0.52,'#6c39a5'); sky.addColorStop(1,'#f2a3b4');
  ctx.fillStyle = sky; ctx.fillRect(0,0,canvas.width,canvas.height);

  const sunX = canvas.width * 0.78, sunY = 150;
  const sun = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,110);
  sun.addColorStop(0,'rgba(255,244,184,.95)'); sun.addColorStop(.35,'rgba(255,219,140,.46)'); sun.addColorStop(1,'rgba(255,219,140,0)');
  ctx.fillStyle = sun; ctx.fillRect(sunX-120, sunY-120, 240, 240);

  for(let i=0;i<10;i++){
    const x = ((i*320 - state.cameraX*0.12) % (canvas.width+260)) - 120;
    const y = 120 + (i%3)*28;
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath();
    ctx.arc(x,y,32,0,Math.PI*2); ctx.arc(x+38,y+8,24,0,Math.PI*2); ctx.arc(x-30,y+10,22,0,Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(-(state.cameraX*0.10),0);
  for(let i=0;i<10;i++){
    const bx = i*520 - 40;
    ctx.fillStyle = i%2 ? 'rgba(80,34,112,.32)' : 'rgba(60,24,92,.40)';
    ctx.beginPath();
    ctx.moveTo(bx,canvas.height-160);
    ctx.quadraticCurveTo(bx+130,canvas.height-360,bx+280,canvas.height-160);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = 'rgba(255,209,224,.40)';
  ctx.fillRect(0, canvas.height - 190, canvas.width, 200);
  ctx.fillStyle = 'rgba(208,180,240,.44)';
  ctx.fillRect(0, canvas.height - 190, canvas.width, 72);

  const sand = ctx.createLinearGradient(0, canvas.height - 160, 0, canvas.height);
  sand.addColorStop(0, '#e8c89d'); sand.addColorStop(1, '#c79a63');
  ctx.fillStyle = sand; ctx.fillRect(0, canvas.height - 160, canvas.width, 200);

  ctx.save();
  ctx.translate(-(state.cameraX*0.16),0);
  [120,1180,2260,3340,4300,5100].forEach((x,i)=>drawPalm(x, canvas.height-160, i%2?170:190));
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.shadowColor = 'rgba(255,80,80,.35)';
  ctx.shadowBlur = 18;
  // simple crab-like enemy
  ctx.fillStyle='#d33b3b';
  ctx.beginPath(); ctx.arc(e.x+28,e.y+28,22,0,Math.PI*2); ctx.fill();
  ctx.fillRect(e.x+6,e.y+18,12,6); ctx.fillRect(e.x+38,e.y+18,12,6);
  ctx.fillStyle='#fff'; ctx.fillRect(e.x+18,e.y+16,7,7); ctx.fillRect(e.x+30,e.y+16,7,7);
  ctx.restore();
}

function drawWorld(){
  ctx.save();
  if(state.shake > 0) {
    const sx = (Math.random()-0.5)*state.shake, sy=(Math.random()-0.5)*state.shake*0.6;
    ctx.translate(sx, sy);
    state.shake *= 0.86;
    if(state.shake < 0.2) state.shake = 0;
  }
  ctx.translate(-state.cameraX, 0);

  for(const p of world.platforms){
    ctx.fillStyle = p.y >= world.groundY ? '#d7af79' : '#efce98';
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle = p.y >= world.groundY ? '#75d767' : '#ffe0af';
    ctx.fillRect(p.x,p.y,p.w,18);
  }

  for(const c of world.coins){
    if(c.collected) continue;
    const glow = 8 + Math.sin(c.pulse) * 2;
    ctx.fillStyle = 'rgba(255,231,150,.20)';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r+glow,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill();
  }

  for(const e of world.enemies) if(e.alive) drawEnemy(e);

  if(world.boss.alive) {
    const b = world.boss;
    const bob = Math.sin(b.t) * 4;
    ctx.save();
    ctx.shadowColor = 'rgba(255,65,65,.42)';
    ctx.shadowBlur = 30;
    ctx.drawImage(bossSprite, b.x, b.y + bob, b.w, b.h);
    ctx.restore();
  }

  for(const p of state.landFX){
    ctx.fillStyle = 'rgba(210,170,120,' + (p.life/26) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
  }
  for(const p of state.coinFX){
    const alpha = (p.life / (p.hit ? 18 : 22));
    ctx.fillStyle = p.hit ? 'rgba(255,90,90,' + alpha + ')' : 'rgba(255,220,100,' + alpha + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.hit ? 4 : 3, 0, Math.PI*2); ctx.fill();
  }

  drawSarah();
  ctx.restore();
}

function drawSarah(){
  const frameW = 96, frameH = 128;
  let frame = 0;
  const justLanded = state.time - player.landedAt < 6;
  if(justLanded) frame = 7;
  else if(!player.onGround) frame = 6;
  else if(Math.abs(player.vx) > 0.8) frame = 2 + (Math.floor(state.time / 6) % 4);
  else frame = (Math.floor(state.time / 18) % 2);

  const drawW = player.w * player.squash;
  const drawH = player.h / player.squash;
  const offsetX = player.x + (player.w - drawW)/2;
  const offsetY = player.y + (player.h - drawH);

  ctx.save();
  if(player.facing === -1) {
    ctx.translate(offsetX + drawW, 0);
    ctx.scale(-1, 1);
    ctx.translate(-offsetX, 0);
  }
  ctx.shadowColor = 'rgba(255,120,180,.24)';
  ctx.shadowBlur = 18;
  if(!(player.invuln > 0 && Math.floor(player.invuln/4)%2===0)){
    ctx.drawImage(sprite, frame*frameW, 0, frameW, frameH, offsetX, offsetY, drawW, drawH);
  }
  ctx.restore();
}

function loop(){ update(); drawBackground(); if(state.running) drawWorld(); requestAnimationFrame(loop); }
loop();
</script>
